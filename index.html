function normalizeNisn(n){ return String(n||'').trim(); }

function findStudentByNisn(nisn, list){
  const n = normalizeNisn(nisn);
  if(!n) return null;
  return (list || state.students).find(s => normalizeNisn(s.nisn) === n) || null;
}

async function addStudent(){
  const kelas = document.getElementById('fKelas').value.trim();
  const name = document.getElementById('fName').value.trim();
  const nisn = document.getElementById('fNisn').value.trim();
  const wa = document.getElementById('fWa').value.trim();
  if(!name || !kelas){ alert('Nama dan kelas wajib diisi.'); return; }
  if(nisn){
    const dup = findStudentByNisn(nisn);
    if(dup){ alert(`NISN ${nisn} sudah terdaftar atas nama ${dup.name} (${dup.kelas}). NISN harus unik.`); return; }
  }
  const student = { id:uid(), name, kelas, nisn, parentWA:wa, code:genCode() };

  const btn = document.getElementById('btnAddStudent');
  if(btn){ btn.disabled = true; btn.textContent = 'Menyimpan...'; }

  if(API_URL){
    try{
      await callApi({ action:'addStudent', student });
    }catch(err){
      alert('Gagal menyimpan ke server: ' + err.message);
      if(btn){ btn.disabled = false; btn.innerHTML = `${ICON.plus} Tambah &amp; Buat Kartu QR`; }
      return;
    }
  }

  state.students.push(student);
  if(!API_URL){ saveStudents(); }
  state.qrModalStudent = student;
  render();
}

/* ================= IMPOR MASSAL DARI SPREADSHEET ================= */
const IMPORT_HEADER_ALIASES = {
  name: ['nama','nama siswa','nama lengkap','nama lengkap siswa'],
  kelas: ['kelas','kls'],
  nisn: ['nisn','nisn siswa','no nisn'],
  parentWA: ['no wa orang tua','no whatsapp orang tua','nomor wa orang tua','wa orang tua','no wa','whatsapp','no hp orang tua','nomor whatsapp','no wa ortu','no. whatsapp orang tua']
};

function normalizeHeader(h){
  return String(h||'').toLowerCase().trim().replace(/[."'`]/g,'').replace(/\s+/g,' ');
}

function matchImportField(header){
  const h = normalizeHeader(header);
  for(const field in IMPORT_HEADER_ALIASES){
    if(IMPORT_HEADER_ALIASES[field].includes(h)) return field;
  }
  return null;
}

function downloadImportTemplate(){
  const header = ['Kelas','Nama','NISN','No WA Orang Tua'];
  const example = ['XI-2','Ahmad Fahri Ramadhan','0051234567','081234567890'];
  const csv = header.join(',') + '\n' + example.join(',') + '\n';
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'template_impor_siswa.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ================= [OPTIMASI LOADING] LAZY-LOAD PUSTAKA BERAT ================= */
// Memuat sebuah <script> eksternal secara dinamis HANYA saat benar-benar
// dibutuhkan (dipanggil pertama kali fitur Admin yang memakainya), bukan di
// setiap pembukaan aplikasi. Di-cache lewat _loadedScripts supaya pemanggilan
// berulang (mis. impor Excel dua kali) tidak memuat ulang pustaka yang sama.
const _loadedScripts = {};
function loadScriptOnce(url, globalCheck){
  // Kalau pustakanya sudah tersedia secara global (mis. sempat dimuat lewat
  // cara lain), anggap sudah siap tanpa perlu fetch apa pun lagi.
  if(globalCheck && globalCheck()) return Promise.resolve();
  if(_loadedScripts[url]) return _loadedScripts[url];
  _loadedScripts[url] = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = url;
    s.onload = () => resolve();
    s.onerror = () => { delete _loadedScripts[url]; reject(new Error('GAGAL_MUAT_PUSTAKA')); };
    document.head.appendChild(s);
  });
  return _loadedScripts[url];
}
function loadXLSX(){
  return loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', ()=> typeof XLSX !== 'undefined');
}
function loadJSZip(){
  return loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js', ()=> typeof JSZip !== 'undefined');
}

function handleImportFile(file){
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      // Pustaka XLSX baru dimuat DI SINI (sekali saja, di-cache untuk
      // pemakaian berikutnya) — bukan sejak aplikasi pertama dibuka.
      await loadXLSX();
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type:'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });
      processImportRows(rows);
    }catch(err){
      alert('Gagal membaca file. Pastikan formatnya .xlsx, .xls, atau .csv sesuai template, dan koneksi internet aktif (pustaka impor perlu dimuat sekali).');
    }
  };
  reader.onerror = () => alert('Gagal membaca file.');
  reader.readAsArrayBuffer(file);
}

function processImportRows(rows){
  if(!rows || !rows.length){ alert('File kosong atau tidak terbaca.'); return; }

  const headerKeys = Object.keys(rows[0]);
  const fieldMap = {};
  headerKeys.forEach(h => { const f = matchImportField(h); if(f) fieldMap[h] = f; });

  const valid = [];
  const errors = [];
  const nisnSeenInFile = new Set(); // deteksi NISN dobel di dalam file yang sama
  rows.forEach((row, idx) => {
    const rec = {};
    for(const h in fieldMap){ rec[fieldMap[h]] = String(row[h] ?? '').trim(); }
    if(!rec.name || !rec.kelas){
      errors.push(`Baris ${idx+2}: nama atau kelas kosong, dilewati.`);
      return;
    }
    const nisn = normalizeNisn(rec.nisn);
    if(nisn){
      const dupExisting = findStudentByNisn(nisn);
      if(dupExisting){
        errors.push(`Baris ${idx+2}: NISN ${nisn} sudah terdaftar atas nama ${dupExisting.name}, dilewati.`);
        return;
      }
      if(nisnSeenInFile.has(nisn)){
        errors.push(`Baris ${idx+2}: NISN ${nisn} dobel di dalam file ini, dilewati.`);
        return;
      }
      nisnSeenInFile.add(nisn);
    }
    valid.push({
      id: uid(),
      name: rec.name,
      kelas: rec.kelas,
      nisn: rec.nisn || '',
      parentWA: rec.parentWA || '',
      code: genCode(),
    });
  });

  if(!Object.values(fieldMap).includes('name') || !Object.values(fieldMap).includes('kelas')){
    alert('Kolom "Nama" dan/atau "Kelas" tidak ditemukan di file. Gunakan template yang disediakan sebagai acuan nama kolom.');
    return;
  }

  state.importPreview = { valid, errors };
  render();
}

// Kecilkan & kompres foto sebelum disimpan/dikirim: kartu presensi hanya
// menampilkan foto di kotak kecil (~20x24mm), dan kalau tersambung server,
// foto disimpan sebagai teks base64 di sel Google Sheets yang punya batas
// ~50.000 karakter — jadi foto DIWAJIBKAN kecil, bukan sekadar opsional.
function resizeImageDataUrl(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w >= h){ if(w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
        else{ if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('Gagal membaca gambar.'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('Gagal membaca file.'));
    reader.readAsDataURL(file);
  });
}

// Simpan foto siswa yang diunggah dari slot foto pada kartu presensi.
// Kalau aplikasi tersambung server (API_URL), foto dikirim & disimpan di
// Google Sheets lewat aksi "updatePhoto" (lihat Code.gs) supaya bisa
// tercetak dari komputer manapun. Kalau tidak tersambung server, foto
// disimpan di localStorage browser ini saja (lihat savePhotoLocal).
async function handlePhotoUpload(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ alert('File harus berupa gambar (JPG/PNG).'); return; }
  const student = state.qrModalStudent;
  const slot = document.getElementById('photoSlot');
  if(slot) slot.style.opacity = '0.5';
  try{
    const resized = await resizeImageDataUrl(file, 240, 0.72);
    if(API_URL){
      await callApi({ action:'updatePhoto', id: student.id, photo: resized });
    }
    const idx = state.students.findIndex(s=>s.id===student.id);
    if(idx>-1){
      state.students[idx].photo = resized;
      state.qrModalStudent = state.students[idx];
      if(!API_URL){ savePhotoLocal(student.id, resized); }
    }
    render();
  }catch(err){
    alert('Gagal menyimpan foto: ' + err.message + (API_URL ? '\n\nPastikan Code.gs di Apps Script sudah ditambahkan aksi "updatePhoto" dan dideploy ulang.' : ''));
    if(slot) slot.style.opacity = '1';
  }
}

/* ================= UNGGAH FOTO MASSAL (cocok otomatis dari nama file) ================= */
// Ratakan teks (nama siswa ATAU nama file) supaya bisa dibandingkan apa
// adanya: huruf kecil semua, garis bawah/strip dianggap spasi, tanda baca
// dibuang, spasi ganda dirapikan.
function normalizeMatchText(str){
  return String(str||'')
    .toLowerCase()
    .replace(/[_\-]+/g,' ')
    .replace(/[.,()]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

// Buang ekstensi file (.jpg, .jpeg, .png, dst) dari nama file.
function stripExt(filename){
  return String(filename||'').replace(/\.[a-z0-9]+$/i,'');
}

// Cocokkan satu nama file (tanpa ekstensi) ke salah satu siswa di `students`.
// Urutan pencocokan: (1) sama persis dengan nama siswa, (2) sama persis
// dengan NISN siswa, (3) jika tidak ada yang sama persis, coba cocok
// sebagian (mengandung) tapi HANYA dipakai kalau hasilnya tunggal/tidak
// ambigu, supaya tidak salah tempel ke siswa yang salah.
function matchStudentByFileName(rawName, students){
  const norm = normalizeMatchText(stripExt(rawName));
  if(!norm) return null;

  for(const s of students){ if(normalizeMatchText(s.name) === norm) return s; }
  for(const s of students){ if(s.nisn && normalizeMatchText(s.nisn) === norm) return s; }

  const contains = students.filter(s=>{
    const n = normalizeMatchText(s.name);
    return n && (norm.includes(n) || n.includes(norm));
  });
  if(contains.length === 1) return contains[0];

  return null;
}

// Proses banyak file foto sekaligus: setiap file dicocokkan ke siswa lewat
// namanya, lalu ditempelkan sebagai foto siswa tsb. Kalau tersambung server,
// tiap foto juga dikirim & disimpan di Google Sheets (aksi "updatePhoto")
// supaya bisa dipakai mencetak kartu dari komputer manapun. Di akhir,
// tampilkan ringkasan berapa yang berhasil, file yang tidak cocok namanya,
// dan (kalau ada) foto yang gagal dikirim ke server.
async function handleBulkPhotoUpload(fileList){
  const files = Array.from(fileList||[]).filter(f=>f.type.startsWith('image/'));
  if(!files.length){ alert('Tidak ada file gambar yang dipilih.'); return; }

  const btn = document.getElementById('btnPickBulkPhoto');
  if(btn){ btn.disabled = true; }

  let matched = 0;
  const unmatched = [];
  const serverFailed = [];

  for(let i=0;i<files.length;i++){
    const file = files[i];
    if(btn) btn.textContent = `Memproses ${i+1}/${files.length}...`;
    const student = matchStudentByFileName(file.name, state.students);
    if(!student){ unmatched.push(file.name); continue; }
    try{
      const resized = await resizeImageDataUrl(file, 240, 0.72);
      if(API_URL){
        try{
          await callApi({ action:'updatePhoto', id: student.id, photo: resized });
        }catch(err){
          serverFailed.push(file.name);
          continue; // jangan tandai "matched" kalau gagal tersimpan di server
        }
      }
      const idx = state.students.findIndex(s=>s.id===student.id);
      if(idx>-1){
        state.students[idx].photo = resized;
        if(!API_URL){ savePhotoLocal(student.id, resized); }
        matched++;
      }
    }catch(err){
      unmatched.push(file.name);
    }
    if(i % 5 === 4){ await new Promise(r=> setTimeout(r, 0)); }
  }

  if(!API_URL){ saveStudents(); }
  render();

  if(btn){ btn.disabled = false; btn.innerHTML = `${ICON.upload} Pilih Foto (Banyak Sekaligus)`; }

  let msg = `${matched} dari ${files.length} foto berhasil dicocokkan & dipasang ke data siswa.`;
  if(unmatched.length){
    msg += `\n\nFile berikut TIDAK ditemukan siswa yang cocok namanya (periksa ejaan nama file):\n- ${unmatched.join('\n- ')}`;
  }
  if(serverFailed.length){
    msg += `\n\nFile berikut GAGAL disimpan ke server (jaringan/Code.gs belum mendukung "updatePhoto"):\n- ${serverFailed.join('\n- ')}`;
  }
  alert(msg);
}

/* ================= RENDER KARTU SISWA LENGKAP (untuk unduhan) ================= */
// Menggambar seluruh tampilan kartu presensi (logo, foto, nama, kelas, kode,
// QR) ke satu kanvas beresolusi cetak (300dpi) seukuran fisik KTP potret
// (53.98mm x 85.6mm), supaya file yang diunduh adalah kartu utuh, bukan
// sekadar QR code polos. Dipakai baik untuk unduhan satuan maupun massal.
const CARD_DPI = 300;
const MM = CARD_DPI / 25.4;   // px kanvas per mm
const CPX = CARD_DPI / 96;    // px kanvas per 1 CSS px

function loadImage(src){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function roundRectPath(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

// Gambar `img` ke kotak (x,y,w,h) dengan perilaku object-fit:cover.
function drawImageCover(ctx, img, x, y, w, h){
  const ir = img.width / img.height, dr = w / h;
  let sx, sy, sw, sh;
  if(ir > dr){ sh = img.height; sw = sh * dr; sx = (img.width - sw)/2; sy = 0; }
  else { sw = img.width; sh = sw / dr; sx = 0; sy = (img.height - sh)/2; }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

async function renderCardCanvas(student){
  if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }

  const W = Math.round(53.98 * MM), H = Math.round(85.6 * MM);
  const pad = 3.2 * MM;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top'; // y selalu berarti "atas teks", supaya perhitungan tinggi baris konsisten & tidak salah hitung

  // latar belakang gradasi kartu
  const grad = ctx.createLinearGradient(0, 0, W*0.35, H);
  grad.addColorStop(0, '#0D3A5C');
  grad.addColorStop(1, '#061A2B');
  roundRectPath(ctx, 0, 0, W, H, 3*MM);
  ctx.fillStyle = grad; ctx.fill();
  ctx.lineWidth = 1*CPX;
  ctx.strokeStyle = '#0B4468';
  roundRectPath(ctx, ctx.lineWidth/2, ctx.lineWidth/2, W-ctx.lineWidth, H-ctx.lineWidth, 3*MM);
  ctx.stroke();

  let y = pad;

  // logo
  try{
    const logo = await loadImage(LOGO_DATA_URI);
    const logoSize = 14*MM;
    ctx.drawImage(logo, (W-logoSize)/2, y, logoSize, logoSize);
    y += logoSize + 0.8*MM;
  }catch(e){ y += 14*MM + 0.8*MM; }

  // nama sekolah (setara CSS font-size:5.8px)
  const schoolSize = 11.6*CPX;
  ctx.fillStyle = '#FFFFFF';
  ctx.font = `${schoolSize}px 'JetBrains Mono', monospace`;
  ctx.fillText('STUDENT ATTENDANCE CARD', W/2, y);
  y += schoolSize*1.25 + 1.8*MM;

  // slot foto — ukuran TETAP 25mm x 30mm, ditengahkan secara horizontal.
  // Nama siswa digambar TEPAT di bawahnya (rata tengah); kelas & kode
  // dipindah ke baris bawah kartu, di sebelah kiri kode QR.
  const photoW = 25*MM, photoH = 30*MM, photoX = (W-photoW)/2;
  if(student.photo){
    try{
      const photoImg = await loadImage(student.photo);
      ctx.save();
      roundRectPath(ctx, photoX, y, photoW, photoH, 1.6*MM);
      ctx.clip();
      drawImageCover(ctx, photoImg, photoX, y, photoW, photoH);
      ctx.restore();
    }catch(e){}
  }else{
    ctx.save();
    roundRectPath(ctx, photoX, y, photoW, photoH, 1.6*MM);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fill();
    ctx.setLineDash([4,3]);
    ctx.strokeStyle = 'rgba(175,203,219,0.55)';
    ctx.lineWidth = 1*CPX;
    ctx.stroke();
    ctx.setLineDash([]);
    const hintSize = 6*CPX;
    ctx.fillStyle = '#AFCBDB';
    ctx.font = `${hintSize}px 'Inter', sans-serif`;
    ctx.fillText('Foto', photoX+photoW/2, y+photoH/2-hintSize/2);
    ctx.restore();
  }
  y += photoH + 1.8*MM;

  // Nama siswa — TEPAT di bawah foto, rata tengah, maks 2 baris.
  ctx.textAlign = 'center';
  const nmSize = 10.55*CPX, nmLineHeight = nmSize*1.25;
  ctx.font = `700 ${nmSize}px 'Space Grotesk', sans-serif`;
  const nmLines = wrapTextLines(ctx, student.name, W-2*pad, 2);
  ctx.fillStyle = '#EAF4FA';
  nmLines.forEach((ln,i)=> ctx.fillText(ln, W/2, y + i*nmLineHeight));
  y += nmLines.length*nmLineHeight;

  // --- Geometri BARIS BAWAH: kelas & kode + kotak QR SEKARANG dipusatkan
  // sebagai SATU KELOMPOK (bukan lagi rata kiri-kanan penuh) — didorong ke
  // dasar kartu, memakai sisa ruang yang tidak terpakai oleh foto+nama di
  // atasnya (persis meniru margin-top:auto pada versi HTML/CSS).
  const qrSize = 16*MM, qrPad = 1*MM, qrBoxSize = qrSize + qrPad*2; // UKURAN QR TETAP SAMA seperti sebelumnya
  const rowGap = 3*MM;          // jarak blok teks ke kotak QR
  const rowMarginBottom = 3*MM; // jarak baris bawah ke tepi bawah kartu
  const rowH = qrBoxSize;       // tinggi baris mengikuti tinggi kotak QR (lebih tinggi dari blok teks)
  const rowTop = H - pad - rowMarginBottom - rowH;

  // Lebar blok teks (kelas/kode) = teks TERLEBAR di antara keduanya, supaya
  // seluruh kelompok (teks + jarak + kotak QR) bisa dipusatkan secara akurat.
  const clsSize = 7*CPX, clsLineHeight = clsSize*1.25;
  const codeSize = 6*CPX, codeLineHeight = codeSize*1.25;
  ctx.font = `${clsSize}px 'Inter', sans-serif`;
  const clsW = ctx.measureText(student.kelas).width;
  ctx.font = `${codeSize}px 'JetBrains Mono', monospace`;
  const codeW = ctx.measureText(student.code).width;
  const textBlockW = Math.max(clsW, codeW);

  const groupW = textBlockW + rowGap + qrBoxSize;
  const groupX = (W - groupW) / 2; // pusatkan seluruh kelompok secara horizontal
  const textX = groupX, qrX = groupX + textBlockW + rowGap, qrY = rowTop;

  // --- Blok teks (kelas, kode) — RATA KIRI di dalam kelompoknya sendiri,
  // divertikal-tengahkan terhadap tinggi kotak QR di sisi kanannya.
  ctx.textAlign = 'left';
  const textBlockH = clsLineHeight + 1.2*MM + codeLineHeight;
  let ty = rowTop + (rowH - textBlockH)/2;

  ctx.fillStyle = '#AFCBDB';
  ctx.font = `${clsSize}px 'Inter', sans-serif`;
  ctx.fillText(student.kelas, textX, ty);
  ty += clsLineHeight + 1.2*MM;

  ctx.fillStyle = 'rgba(225,230,240,0.6)';
  ctx.font = `${codeSize}px 'JetBrains Mono', monospace`;
  ctx.fillText(student.code, textX, ty);
  ctx.textAlign = 'center';

  // QR code — UKURAN SAMA seperti sebelumnya (16mm), sekarang di kanan kelompok yang dipusatkan
  ctx.fillStyle = '#ffffff';
  roundRectPath(ctx, qrX, qrY, qrBoxSize, qrBoxSize, 1.2*MM);
  ctx.fill();
  const qrDataUrl = generateQrDataUrl(student.code, 400);
  if(qrDataUrl){
    try{
      const qrImg = await loadImage(qrDataUrl);
      ctx.drawImage(qrImg, qrX+qrPad, qrY+qrPad, qrSize, qrSize);
    }catch(e){}
  }

  return canvas;
}

// Bungkus teks ke maksimal `maxLines` baris supaya tidak meluber dari lebar
// yang tersedia — HANYA menghitung & mengembalikan baris-barisnya (tidak
// langsung menggambar), supaya pemanggil bisa tahu dulu tinggi total blok
// teks SEBELUM menggambar (dibutuhkan untuk menengahkan blok teks secara
// vertikal terhadap tinggi kotak QR di sebelahnya).
function wrapTextLines(ctx, text, maxWidth, maxLines){
  const words = String(text||'').split(' ');
  const lines = [];
  let line = '';
  for(const w of words){
    const test = line ? line+' '+w : w;
    if(ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = w; }
    else line = test;
  }
  if(line) lines.push(line);
  return lines.slice(0, maxLines || lines.length);
}

// Unduh satu kartu siswa (dari modal QR) sebagai gambar PNG lengkap.
// Memakai Blob + object URL (bukan data URI langsung) dan anchor yang
// sungguh-sungguh dipasang ke halaman sebelum diklik, supaya unduhan
// tetap berjalan konsisten di berbagai browser.
async function downloadQr(){
  const btn = document.getElementById('btnDownloadQr');
  if(btn){ btn.disabled = true; btn.textContent = 'Menyiapkan...'; }
  try{
    const canvas = await renderCardCanvas(state.qrModalStudent);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    if(!blob){ alert('Gagal membuat gambar kartu. Coba lagi.'); return; }
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = `kartu-presensi-${sanitizeFileName(state.qrModalStudent.name)}-${state.qrModalStudent.code}.png`;
    link.href = url;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(()=> URL.revokeObjectURL(url), 4000);
  }catch(err){
    console.error(err);
    alert('Gagal menyiapkan kartu untuk diunduh: ' + err.message);
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = 'Unduh Kartu Presensi'; }
  }
}

/* ================= UNDUH KARTU SISWA MASSAL (ZIP) ================= */
// Bersihkan nama file dari karakter yang tidak valid di sistem berkas.
function sanitizeFileName(str){
  return String(str||'').trim().replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,'_') || 'siswa';
}

// Render satu kode QR ke kanvas tersembunyi (di luar layar) lalu ambil data
// gambarnya sebagai data URL PNG. Dipakai berulang untuk unduhan massal
// tanpa menampilkan kanvas sementara ini ke pengguna.
function generateQrDataUrl(text, size){
  const holder = document.createElement('div');
  holder.style.position = 'absolute';
  holder.style.left = '-9999px';
  holder.style.top = '-9999px';
  document.body.appendChild(holder);
  new QRCode(holder, { text, width: size||300, height: size||300, colorDark:'#0A2540', colorLight:'#ffffff' });
  const canvas = holder.querySelector('canvas');
  const dataUrl = canvas ? canvas.toDataURL('image/png') : null;
  document.body.removeChild(holder);
  return dataUrl;
}

// Buat & unduh satu file ZIP berisi kartu siswa lengkap (PNG, dengan logo,
// foto, nama, kelas, dan QR) untuk setiap siswa di dalam `list`. Dipakai
// tombol "Unduh Kartu Presensi (ZIP)" di panel Admin.
async function downloadAllQr(list){
  if(!list || !list.length){
    alert('Tidak ada siswa pada pilihan ini untuk diunduh kartunya.');
    return;
  }
  const btn = document.getElementById('btnDownloadAllQr');
  if(btn){ btn.disabled = true; btn.textContent = 'Menyiapkan pustaka ZIP...'; }
  try{
    // Pustaka JSZip baru dimuat DI SINI (sekali saja, di-cache) — bukan
    // sejak aplikasi pertama dibuka — lihat loadJSZip()/loadScriptOnce().
    await loadJSZip();
  }catch(e){
    alert('Gagal memuat pustaka ZIP. Periksa koneksi internet lalu coba lagi.');
    if(btn){ btn.disabled = false; btn.innerHTML = `${ICON.download} Unduh Kartu Presensi (ZIP)`; }
    return;
  }

  const zip = new JSZip();
  const usedNames = {};
  let failCount = 0;
  for(let i=0;i<list.length;i++){
    const s = list[i];
    if(btn) btn.textContent = `Menyiapkan ${i+1}/${list.length}...`;
    try{
      const canvas = await renderCardCanvas(s);
      const dataUrl = canvas.toDataURL('image/png');
      const base64 = dataUrl.split(',')[1];
      let fname = `${sanitizeFileName(s.kelas)}_${sanitizeFileName(s.name)}_${s.code}.png`;
      if(usedNames[fname]){
        usedNames[fname]++;
        fname = fname.replace(/\.png$/, `_${usedNames[fname]}.png`);
      }else{
        usedNames[fname] = 1;
      }
      zip.file(fname, base64, { base64:true });
    }catch(err){
      console.error('Gagal membuat kartu untuk', s.name, err);
      failCount++;
    }
    // beri jeda singkat tiap 10 kartu supaya antarmuka tetap responsif
    // (renderCardCanvas lebih berat daripada QR polos karena memuat gambar)
    if(i % 10 === 9){ await new Promise(r=> setTimeout(r, 0)); }
  }
  if(failCount === list.length){
    alert('Gagal membuat kartu siswa. Coba lagi.');
    if(btn){ btn.disabled = false; btn.innerHTML = `${ICON.download} Unduh Kartu Presensi (ZIP)`; }
    return;
  }

  if(btn) btn.textContent = 'Membuat file ZIP...';
  const blob = await zip.generateAsync({ type:'blob' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const scopeLabel = (list.length === state.students.length) ? 'semua-siswa' : sanitizeFileName(list[0].kelas);
  a.download = `kartu-presensi-${scopeLabel}.zip`;
  a.href = url;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);

  if(btn){ btn.disabled = false; btn.innerHTML = `${ICON.download} Unduh Kartu Presensi (ZIP)`; }
}

/* ================= UNDUH KODE QR POLOS (satuan & massal) ================= */
// Berbeda dari downloadQr()/downloadAllQr() di atas: fungsi-fungsi ini

// Buat & unduh satu file ZIP berisi kode QR POLOS (bukan kartu presensi
// lengkap) untuk setiap siswa di dalam `list`. Dipakai tombol
// "Unduh Kode QR (ZIP)" pada tab "Unduh Kode QR" di panel Admin.
async function downloadAllQrOnly(list){

  }catch(e){

  }

  const zip = new JSZip();
  const usedNames = {};
  let failCount = 0;
  for(let i=0;i<list.length;i++){

      failCount++;
    }
    // beri jeda singkat tiap 20 kode supaya antarmuka tetap responsif
    if(i % 20 === 19){ await new Promise(r=> setTimeout(r, 0)); }
  }
  if(failCount === list.length){
    alert('Gagal membuat kode QR siswa. Coba lagi.');
    if(btn){ btn.disabled = false; btn.innerHTML = `${ICON.download} Unduh Kode QR (ZIP)`; }

  if(btn) btn.textContent = 'Membuat file ZIP...';

  const scopeLabel = (list.length === state.students.length) ? 'semua-siswa' : sanitizeFileName(list[0].kelas);
  a.download = `kode-qr-${scopeLabel}.zip`;
  a.href = url;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);

  if(btn){ btn.disabled = false; btn.innerHTML = `${ICON.download} Unduh Kode QR (ZIP)`; }
}

// Menyimpan catatan Masuk/Pulang — dipakai untuk SEMUA jalur pencatatan biasa:
// siswa dipilih manual saat mode Pemindai Masuk/Pulang, maupun lewat Input Manual
// Masuk/Pulang. TIDAK ada keterangan (Hadir/Sakit/dll) yang disertakan di sini —
// keterangan hanya bisa ditambahkan belakangan lewat mode "Input Manual (Keterangan)".
// Kekecualian: type==='alpa' (siswa TIDAK MASUK sekolah) — dicatat langsung dengan
// keterangan "Alpa" pada slot Masuk hari itu (karena siswa memang tidak hadir sama
// sekali, jadi tidak ada catatan Masuk terlebih dahulu untuk ditambahkan keterangan).
async function confirmManualAttendance(type){
  const s = state.selectedStudent;
  if(!s) return;
  ensureAudio(); // dipanggil di dalam gestur klik tombol agar audio diizinkan browser
  // Cek cepat berbasis cache LOKAL dulu untuk kasus yang jelas-jelas duplikat
  // di PERANGKAT INI. Keputusan yang benar-benar final (termasuk mendeteksi
  // pemindaian dari PERANGKAT LAIN) tetap ditentukan oleh server di bawah.
  const localDup = todayLogsFor(s.id)[type];
  if(localDup){
    playRejectBeep();
    const label = type==='masuk' ? 'MASUK' : 'PULANG';
    showToast(`Pemindaian ditolak — ${s.name} sudah tercatat ${label} hari ini pukul ${timeOnly(localDup.timestamp)}.`, 'warn');
    return;
  }
  const sendWa = state.sendWaNotif;
  const log = { id:uid(), studentId:s.id, type, ket:'', note:'', timestamp:Date.now() };

  // Nonaktifkan tombol sementara menunggu konfirmasi server — mencegah klik
  // ganda yang bisa memicu dua permintaan untuk catatan yang sama.
  const btn = document.getElementById('btnQuickManualConfirm');
  if(btn){ btn.disabled = true; btn.dataset.origText = btn.textContent; btn.textContent = 'Memeriksa...'; }

  // Kirim & TUNGGU konfirmasi SERVER sebelum benar-benar dianggap berhasil —
  // inilah yang mencegah dua perangkat berbeda sama-sama berhasil mencatat
  // siswa yang sama pada hari yang sama.
  const result = await saveLogEntry(log);
  const label = type==='masuk' ? 'MASUK' : 'PULANG';

  if(result.duplicate){
    if(result.existing && !state.logs.some(l=>l.id===result.existing.id)){
      state.logs.push(result.existing);
    }
    playRejectBeep();
    const waktu = result.existing ? ` pukul ${timeOnly(result.existing.timestamp)}` : '';
    showToast(`Pemindaian ditolak — ${s.name} sudah tercatat ${label} hari ini${waktu} (di perangkat lain).`, 'warn');
    if(btn){ btn.disabled = false; btn.textContent = btn.dataset.origText || btn.textContent; }
    return;
  }

  playScanBeep();
  state.logs.push(log);
  state.lastResult = { student:s, ket:'', sendWa, type };
  const sp = document.getElementById('sidePanel'); if(sp) sp.innerHTML = sidePanelContent();
}

// Mode "Input Sakit/Ijin/Emergency" — menyimpan catatan TIDAK HADIR (bukan Masuk
// atau Pulang) untuk siswa yang HARI INI belum discan/diinput sama sekali,
// lengkap dengan alasannya (Sakit/Ijin/Emergency/ketik sendiri). Kalau siswa ini
// sudah punya catatan Tidak Hadir hari ini, keterangannya DIPERBARUI (bukan
// dobel) — supaya operator bisa mengoreksi kalau salah pilih sebelumnya.
async function confirmTidakHadir(){
  const s = state.selectedStudent;
  if(!s) return;
  ensureAudio(); // dipanggil di dalam gestur klik tombol agar audio diizinkan browser

  // Jaga-jaga: kalau di antara siswa dipilih & tombol ditekan ternyata siswa
  // ini sudah tercatat Masuk (mis. discan operator lain), batalkan — mode ini
  // memang khusus untuk siswa yang benar-benar belum hadir sama sekali.
  const already = todayLogsFor(s.id).masuk;
  if(already){
    showToast(`Dibatalkan — ${s.name} sudah tercatat MASUK hari ini pukul ${timeOnly(already.timestamp)}. Gunakan Input Keterangan.`, 'warn');
    refreshSidePanel();

  }

  const sendWa = state.sendWaNotif;
  const ket = state.selectedKet;

  const existing = todayTidakHadirFor(s.id);

  const btn = document.getElementById('btnConfirmTidakHadir');
  if(btn){ btn.disabled = true; btn.dataset.origText = btn.textContent; btn.textContent = 'Menyimpan...'; }

  if(existing){
    existing.ket = ket; existing.note = note;
    await updateLogEntry(existing);
    playScanBeep();
    state.lastResult = { student:s, ket, sendWa, type:'tidakHadir', updated:true };
  }else{
    const log = { id:uid(), studentId:s.id, type:'tidakHadir', ket, note, timestamp:Date.now() };
    const result = await saveLogEntry(log);
    if(result.duplicate){
      if(result.existing && !state.logs.some(l=>l.id===result.existing.id)){
        state.logs.push(result.existing);
      }
      playRejectBeep();
      showToast(`Ditolak — ${s.name} sudah memiliki catatan hari ini (di perangkat lain).`, 'warn');

      return;

/* ================= NOTIFIKASI (TOAST) ================= */
// Notifikasi tulisan untuk setiap pemindaian yang GAGAL atau DITOLAK (kode tidak
// dikenali, atau siswa sudah tercatat masuk/pulang hari ini). Elemen dibuat sekali
// dan ditempel langsung ke <body> (bukan lewat innerHTML render()) supaya animasi
// keluar-masuknya tidak terpotong saat layar dirender ulang.
let toastTimer = null;
function ensureToastEl(){
  let el = document.getElementById('globalToast');
  if(!el){
    el = document.createElement('div');
    el.id = 'globalToast';
    el.className = 'global-toast';
    document.body.appendChild(el);
  }
  return el;
}
function showToast(message, kind){
  const el = ensureToastEl();
  el.textContent = message;
  el.className = `global-toast show ${kind||'err'}`;
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.classList.remove('show'); }, 3400);
}

/* ================= AUDIO: efek bunyi pemindaian ================= */
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ /* audio tidak didukung */ }
  }
  if(audioCtx && audioCtx.state === 'suspended'){ audioCtx.resume(); }
}
function playBeep(freq, duration, type, volume, delay){
  if(!audioCtx) return;
  try{
    const t0 = audioCtx.currentTime + (delay||0);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq || 880;
    const vol = volume==null ? 0.28 : volume;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + (duration || 0.12));
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + (duration || 0.12) + 0.03);
  }catch(e){ /* abaikan jika audio gagal diputar */ }
}
// [PENGUATAN PEMINDAIAN] Getaran singkat sebagai umpan balik TAMBAHAN selain
// bip suara — sangat membantu di lingkungan gerbang yang ramai/berisik saat
// bip sulit terdengar, atau saat HP disetel senyap. Vibration API HANYA
// didukung di HP Android (Chrome/WebView) — otomatis diabaikan dengan aman
// di iPhone (Safari iOS tidak mendukung API ini sama sekali) dan di
// desktop/laptop, tanpa memicu error apa pun.
function vibrateDevice(pattern){
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){ /* abaikan jika tidak didukung */ }
}
// Bip pemindaian BERHASIL — dipakai SAMA PERSIS untuk Pemindai Masuk maupun
// Pemindai Pulang. Dibuat panjang & keras: dua nada NAIK ("ding-DING") berurutan
// dengan lapisan oktaf di atasnya, supaya terasa besar/penuh dan jelas terdengar
// meski di lingkungan gerbang yang ramai.
function playScanBeep(){
  vibrateDevice(60); // getaran pendek tunggal = sinyal "berhasil" yang singkat & positif
  if(!audioCtx) return;
  playBeep(988,  0.16, 'triangle', 0.95, 0);     // nada 1 (pendek)
  playBeep(1319, 0.36, 'triangle', 0.98, 0.15);  // nada 2 (naik, panjang) — puncak bip
  playBeep(1976, 0.32, 'sine',     0.55, 0.15);  // lapisan oktaf atas, kesan "besar"/penuh
}
// Bip pemindaian GAGAL/DITOLAK (kode tak dikenali ATAU sudah tercatat hari ini) —
// dipakai SAMA PERSIS untuk Pemindai Masuk maupun Pemindai Pulang. Sengaja dibuat
// panjang & keras juga, tapi dengan pola nada TURUN dan gelombang gerigi (sawtooth)
// yang lebih tegas/kasar — supaya jelas berbeda dari bip sukses hanya dengan
// mendengarkan, tanpa perlu melihat layar.
function playRejectBeep(){
  vibrateDevice([50,60,50]); // getaran GANDA (putus-putus) = sinyal "ditolak", terasa berbeda dari getaran sukses
  if(!audioCtx) return;
  playBeep(392, 0.20, 'sawtooth', 0.9, 0);     // nada 1
  playBeep(261, 0.40, 'sawtooth', 0.95, 0.19); // nada 2 (turun, panjang) — penekanan penolakan
}

/* ================= CAMERA / QR SCAN ================= */
let scanRAF = null, scanUsingRVFC = false, scanCanvas = null, scanCtx = null, scanCanvasFull = null, scanCtxFull = null, scanFrameCounter = 0;

// [OPTIMASI KECEPATAN] Menjadwalkan pemindaian frame berikutnya lewat
// video.requestVideoFrameCallback() jika didukung perangkat (Chrome/Edge,
// Safari iOS 15.4+) — API ini memanggil callback TEPAT saat frame video
// baru benar-benar tersedia dari kamera, bukan sekadar mengikuti irama
// refresh layar (requestAnimationFrame), yang kadang memicu pemrosesan
// ulang frame video YANG SAMA lebih dari sekali. Hasilnya: tidak ada
// jatah CPU yang terbuang untuk memindai frame lama berulang kali,
// sehingga lebih banyak pembacaan QR sungguhan bisa dilakukan tiap detik.
// Otomatis kembali memakai requestAnimationFrame di perangkat yang belum
// mendukung API ini (mis. sebagian besar Safari lama, Firefox).
function scheduleNextScan(video){
  if(typeof video.requestVideoFrameCallback === 'function'){
    scanUsingRVFC = true;
    scanRAF = video.requestVideoFrameCallback(()=>tickScan(video));
  }else{
    scanUsingRVFC = false;
    scanRAF = requestAnimationFrame(()=>tickScan(video));
  }
}
const MAX_SCAN_DIM = 720; // diperkecil dari 900 — jsQR memproses lebih cepat pada gambar lebih kecil, menambah jumlah percobaan pembacaan per detik

// [PENGUATAN PEMINDAIAN] BarcodeDetector — decoder QR NATIVE bawaan OS/
// browser (dipercepat perangkat keras), TERUTAMA tersedia di Android/
// Chrome & Samsung Internet. JAUH lebih cepat & akurat dibanding jsQR
// (decoder JS murni) karena tidak perlu menggambar frame ke canvas dulu —
// dijalankan LANGSUNG pada elemen <video>. Dipakai sebagai LAPISAN
// PERTAMA (tercepat) di tickScan(); kalau tidak tersedia (Safari/iOS dan
// sebagian browser lain belum mendukung sama sekali) atau gagal
// menemukan kode, otomatis jatuh ke jsQR sebagai cadangan universal yang
// SUDAH TERBUKTI jalan di semua perangkat — jadi fungsi pemindaian tidak
// pernah bergantung sepenuhnya pada API ini.
let nativeBarcodeDetector = null;
(async function initNativeBarcodeDetector(){
  try{
    if('BarcodeDetector' in window){
      const formats = await window.BarcodeDetector.getSupportedFormats();
      if(formats.includes('qr_code')){
        nativeBarcodeDetector = new window.BarcodeDetector({ formats:['qr_code'] });
      }
    }
  }catch(e){
    nativeBarcodeDetector = null; // aman diabaikan — jsQR tetap berjalan normal sebagai cadangan
  }
})();

const SCAN_COOLDOWN_MS = 2500; // jeda singkat anti-dobel (kode tak dikenali / sudah tercatat menurut cache lokal)
const SAME_CODE_SUCCESS_COOLDOWN_MS = 60 * 1000; // 60 detik — jeda panjang untuk kode QR yang SAMA setelah berhasil tercatat (Masuk maupun Pulang)
// Rangkaian constraint kamera dari yang paling spesifik ke yang paling longgar.
//
// [PERKUATAN PEMINDAIAN — PATCH KECEPATAN] SEBELUMNYA resolusi 2K (2560x1440)
// dicoba PALING PERTAMA. Ternyata ini kontraproduktif: setiap frame SELALU
// diperkecil ke MAX_SCAN_DIM (720px) sebelum diproses jsQR/BarcodeDetector —
// jadi resolusi 2K TIDAK menambah manfaat decode sama sekali untuk lapisan
// pemindaian utama, TAPI di banyak HP kelas menengah-bawah, menegosiasikan
// resolusi setinggi itu membuat kamera mengirim frame LEBIH JARANG (FPS
// turun) — inilah penyebab pemindaian TERASA lambat, meski proses decode-nya
// sendiri sudah cepat. Sekarang resolusi 1280x720 dengan frameRate tinggi
// dicoba LEBIH DULU (framenya lebih sering/lancar = lebih banyak kesempatan
// membaca kode per detik = terasa lebih responsif), sementara 1920x1080
// tetap tersedia sebagai cadangan untuk kode QR kecil/jauh yang butuh detail
// ekstra lewat pemindaian area tengah beresolusi asli (lihat tickScan).
// Resolusi 2K/4K DIHAPUS dari rangkaian ini sepenuhnya.
const CAMERA_CONSTRAINT_CHAIN = [
  { video:{ facingMode:{ exact:'environment' }, width:{ ideal:1280 }, height:{ ideal:720 }, frameRate:{ ideal:30, min:15 } } },
  { video:{ facingMode:'environment', width:{ ideal:1280 }, height:{ ideal:720 }, frameRate:{ ideal:30, min:15 } } },
  { video:{ facingMode:'environment', width:{ ideal:1920 }, height:{ ideal:1080 } } },
  { video:{ facingMode:'environment' } },
  { video:true }
];

async function getCameraStream(){
  let lastErr = null;
  for(const constraints of CAMERA_CONSTRAINT_CHAIN){
    try{
      // Batas waktu per percobaan — pada sebagian HP, negosiasi resolusi tinggi
      // bisa menggantung lama tanpa pernah resolve/reject. Tanpa batas waktu,
      // operator hanya melihat "Membuka Kamera..." tanpa penjelasan. Jika satu
      // tingkat constraint melewati batas waktu, anggap gagal dan lanjut ke
      // tingkat constraint berikutnya yang lebih longgar.
      const timeout = new Promise((_, reject)=> setTimeout(()=> reject(new Error('CAMERA_TIMEOUT')), 6000));
      return await Promise.race([ navigator.mediaDevices.getUserMedia(constraints), timeout ]);
    }catch(err){
      lastErr = err;
      // OverconstrainedError / NotFoundError / TypeError → coba constraint berikutnya yang lebih longgar.
      // NotAllowedError / SecurityError (izin ditolak) tidak akan membaik dengan constraint lain, hentikan lebih awal.
      if(err && (err.name === 'NotAllowedError' || err.name === 'SecurityError' || err.name === 'PermissionDeniedError')){
        throw err;
      }
    }
  }
  throw lastErr;
}

function cameraErrorMessage(err){
  const isSecure = window.isSecureContext || location.hostname==='localhost';
  if(!isSecure){
    return 'Kamera hanya bisa diakses lewat koneksi aman (HTTPS). Buka halaman ini melalui tautan https:// agar kamera dapat digunakan.';
  }
  if(typeof jsQR !== 'function'){
    return 'Pustaka pemindai QR gagal dimuat (periksa koneksi internet Anda saat membuka halaman ini), sehingga kamera tidak dapat membaca kode QR. Muat ulang halaman, atau gunakan pencarian manual di bawah.';
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    return 'Peramban ini tidak mendukung akses kamera. Gunakan Chrome/Safari versi terbaru, atau pindai lewat pencarian manual di bawah.';
  }
  if(err && err.message === 'CAMERA_TIMEOUT'){
    return 'Kamera membutuhkan waktu terlalu lama untuk menyala. Coba tekan "Aktifkan Kamera" sekali lagi, atau tutup aplikasi lain yang mungkin sedang memakai kamera.';
  }
  switch(err && err.name){
    case 'NotAllowedError':
    case 'PermissionDeniedError':
      return 'Izin kamera ditolak. Aktifkan izin kamera untuk situs ini lewat pengaturan peramban/HP Anda, lalu tekan "Aktifkan Kamera" lagi.';
    case 'NotFoundError':
    case 'DevicesNotFoundError':
      return 'Tidak ditemukan kamera pada perangkat ini. Gunakan pencarian manual di bawah.';
    case 'NotReadableError':
    case 'TrackStartError':
      return 'Kamera sedang dipakai aplikasi lain. Tutup aplikasi kamera/lainnya lalu coba lagi.';
    case 'OverconstrainedError':
      return 'Kamera perangkat ini tidak mendukung pengaturan yang diminta. Coba lagi atau gunakan pencarian manual.';
    default:
      return 'Tidak dapat mengakses kamera. Anda dapat menggunakan pencarian manual di bawah.';
  }
}

async function toggleCamera(){
  if(state.cameraActive){ stopCamera(); redrawCamButton(); return; }
  ensureAudio(); // AudioContext dibuat/dilanjutkan di dalam gestur pengguna (klik tombol) agar audio boleh diputar nanti

  // Periksa pustaka pemindai QR sudah termuat SEBELUM kamera dinyalakan — supaya
  // petugas tidak melihat kamera menyala tapi tidak pernah merespons kode QR.
  if(typeof jsQR !== 'function'){
    alert(cameraErrorMessage(null));
    return;
  }

  const btn = document.getElementById('btnToggleCam');
  if(btn){ btn.disabled = true; btn.textContent = 'Membuka Kamera...'; }

  try{
    // Lepaskan stream sebelumnya (jika ada) supaya kamera tidak "terkunci" di beberapa
    // perangkat iOS/Android saat tombol ditekan berulang kali dengan cepat.
    if(state.cameraStream){ state.cameraStream.getTracks().forEach(t=>t.stop()); state.cameraStream=null; }

    const stream = await getCameraStream();
    state.cameraStream = stream; state.cameraActive = true;

    const video = document.getElementById('camVideo');
    // Set atribut secara eksplisit lewat JS juga (bukan hanya lewat HTML) karena
    // sebagian WebView Android/iOS (mis. browser dalam-aplikasi) mengabaikan atribut
    // HTML playsinline/muted jika tidak diset ulang lewat JavaScript.
    video.setAttribute('playsinline', 'true');
    video.setAttribute('webkit-playsinline', 'true');
    video.muted = true;
    video.srcObject = stream;

    // Tunggu metadata video siap sebelum play() — mencegah error "play() request was
    // interrupted" yang sering muncul di Safari iOS.
    await new Promise((resolve)=>{
      if(video.readyState >= 1) return resolve();
      video.onloadedmetadata = () => resolve();
    });
    await video.play();

    document.getElementById('camOffMsg').style.display='none';
    document.getElementById('scanLine').style.display='block';
    scanCanvas = document.createElement('canvas');
    scanCanvasFull = document.createElement('canvas'); // khusus pemindaian cadangan area tengah, resolusi asli
    // willReadFrequently: true → mempercepat getImageData berulang (dipakai jsQR tiap
    // frame) terutama di Chrome Android; browser lain mengabaikannya dengan aman.
    scanCtx = scanCanvas.getContext('2d', { willReadFrequently:true });
    scanCtxFull = scanCanvasFull.getContext('2d', { willReadFrequently:true });
    tickScan(video);

    // Tampilkan tombol senter HANYA jika perangkat benar-benar mendukungnya (mis.
    // sebagian besar Android mendukung, iPhone Safari umumnya TIDAK) — supaya
    // tombol tidak tampil percuma di perangkat yang tidak bisa menyalakan flash
    // lewat browser. Berguna untuk memindai di kondisi gerbang yang minim cahaya.
    state.torchOn = false;
    const torchBtn = document.getElementById('btnToggleTorch');
    try{
      const track = stream.getVideoTracks()[0];
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if(caps && caps.torch && torchBtn){ torchBtn.style.display='inline-flex'; }
      // Minta fokus otomatis BERKELANJUTAN (bukan fokus tetap di jarak dekat)
      // jika didukung — penting supaya kode QR yang berjarak agak jauh dari
      // kamera tetap terfokus tajam, bukan buram. Diabaikan dengan aman di
      // perangkat yang tidak mendukung (mis. banyak versi Safari iOS).
      if(caps && caps.focusMode && Array.isArray(caps.focusMode) && caps.focusMode.includes('continuous')){
        track.applyConstraints({ advanced:[{ focusMode:'continuous' }] }).catch(()=>{});
      }
    }catch(e){ /* getCapabilities tidak didukung (mis. Safari) — lewati saja */ }
  }catch(err){
    state.cameraActive = false; state.cameraStream = null;
    alert(cameraErrorMessage(err));
  }
  if(btn) btn.disabled = false;
  redrawCamButton();
}
function redrawCamButton(){
  const b = document.getElementById('btnToggleCam');
  if(b) b.textContent = state.cameraActive ? 'Matikan Kamera' : 'Aktifkan Kamera';
  const t = document.getElementById('btnToggleTorch');
  if(t && !state.cameraActive){ t.style.display='none'; }
}
// Nyalakan/matikan senter (flash) kamera belakang — membantu pemindaian di kondisi
// minim cahaya (mis. gerbang sekolah pagi/menjelang malam). Hanya berfungsi di
// perangkat yang mendukung MediaTrack "torch" (umumnya Android Chrome); pada
// perangkat yang tidak mendukung, tombolnya otomatis disembunyikan.
async function toggleTorch(){
  if(!state.cameraStream) return;
  try{
    const track = state.cameraStream.getVideoTracks()[0];
    state.torchOn = !state.torchOn;
    await track.applyConstraints({ advanced:[{ torch: state.torchOn }] });
    const t = document.getElementById('btnToggleTorch');
    if(t) t.classList.toggle('btn-gold', state.torchOn);
  }catch(e){
    showToast('Senter tidak didukung pada perangkat ini.', 'err');
  }
}
function stopCamera(){
  if(state.cameraStream){ state.cameraStream.getTracks().forEach(t=>t.stop()); }
  state.cameraStream=null; state.cameraActive=false; state.torchOn=false;
  const video = document.getElementById('camVideo');
  // Batalkan penjadwalan frame berikutnya sesuai API yang sedang dipakai
  // (lihat scheduleNextScan) — requestVideoFrameCallback dan
  // requestAnimationFrame punya fungsi pembatalan yang berbeda.
  if(scanRAF){
    if(scanUsingRVFC && video && typeof video.cancelVideoFrameCallback === 'function'){
      try{ video.cancelVideoFrameCallback(scanRAF); }catch(e){ /* abaikan */ }
    }else{
      cancelAnimationFrame(scanRAF);
    }
  }
  scanRAF = null; scanUsingRVFC = false;
  // Lepaskan srcObject secara eksplisit — di iOS Safari, lampu indikator kamera
  // kadang tetap menyala jika srcObject tidak dikosongkan setelah track dihentikan.
  if(video){ try{ video.pause(); }catch(e){} video.srcObject = null; }
  const off = document.getElementById('camOffMsg'); if(off) off.style.display='flex';
  const sl = document.getElementById('scanLine'); if(sl) sl.style.display='none';
}
// Hentikan kamera otomatis saat halaman disembunyikan (pindah aplikasi/tab, kunci
// layar) agar tidak terjadi error kamera "hilang" saat pengguna kembali — pengguna
// tinggal menekan "Aktifkan Kamera" lagi saat kembali ke aplikasi.
document.addEventListener('visibilitychange', () => {
  if(document.hidden && state.cameraActive){
    stopCamera();
    redrawCamButton();
  }
});
async function tickScan(video){
  if(!state.cameraActive) return;
  try{
    if(video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0){
      const vw = video.videoWidth, vh = video.videoHeight;
      let code = null;

      // LAPISAN PERTAMA (kalau tersedia): decoder QR native pada elemen
      // <video> langsung. PENTING — kalau native detector berhasil DIPAKAI
      // (tidak error), jsQR di bawah SENGAJA DILEWATI SEPENUHNYA untuk frame
      // ini, walau native detector tidak menemukan kode apa pun (itu wajar,
      // paling sering terjadi karena memang belum ada kartu di depan
      // kamera). Ini PENTING untuk KECEPATAN: menjalankan jsQR SETELAH native
      // detector pada SETIAP frame (termasuk saat tidak ada kartu sama
      // sekali) berarti mengerjakan DUA KALI proses decode per frame,
      // sehingga justru MEMPERLAMBAT laju pemindaian secara keseluruhan.
      // jsQR HANYA dipakai sebagai cadangan kalau native detector benar-benar
      // TIDAK TERSEDIA di browser ini, atau baru saja gagal/error (jarang).
      if(nativeBarcodeDetector){
        try{
          const barcodes = await nativeBarcodeDetector.detect(video);
          if(barcodes && barcodes.length && barcodes[0].rawValue){
            code = { data: barcodes[0].rawValue };
          }
        }catch(e){
          // Native detector betul-betul bermasalah — matikan untuk SISA sesi
          // pemindaian ini (bukan hanya frame ini), lalu langsung lanjut ke
          // jsQR di bawah sebagai cadangan mulai frame ini juga.
          nativeBarcodeDetector = null;
        }
      }

      // PEMINDAIAN UTAMA (jsQR) — HANYA dijalankan kalau native detector di
      // atas TIDAK TERSEDIA sama sekali (mis. Safari/iOS) atau baru saja
      // dimatikan karena error. { inversionAttempts:"dontInvert" } SENGAJA
      // ditambahkan — tanpa opsi ini, jsQR secara default MENCOBA DUA KALI
      // (warna normal DAN dibalik/invert) di SETIAP pemanggilan untuk
      // menjaga-jaga kode QR putih-di-atas-hitam, padahal kartu presensi di
      // sini SELALU dicetak gelap-di-atas-terang seperti biasa — jadi opsi
      // ini memangkas kerja jsQR kira-kira SETENGAHNYA per frame, mempercepat
      // pemindaian secara nyata tanpa mengurangi keandalan sama sekali untuk
      // kartu yang memang dicetak normal.
      const JSQR_OPTS = { inversionAttempts: 'dontInvert' };
      if(!nativeBarcodeDetector && !code){
        const scale = Math.min(1, MAX_SCAN_DIM / Math.max(vw, vh));
        const sw = Math.max(1, Math.round(vw * scale)), sh = Math.max(1, Math.round(vh * scale));
        scanCanvas.width = sw; scanCanvas.height = sh;
        scanCtx.drawImage(video, 0, 0, sw, sh);
        const img = scanCtx.getImageData(0, 0, sw, sh);
        code = jsQR(img.data, img.width, img.height, JSQR_OPTS);
      }
      // LAPISAN KEDUA — khusus kode QR yang kecil/berjarak agak jauh: kalau
      // pemindaian utama di atas tidak menemukan apa pun, coba pindai ULANG
      // hanya area TENGAH bingkai (tempat operator biasanya mengarahkan kartu)
      // pada RESOLUSI ASLI kamera (canvas terpisah, tidak dipangkas), supaya
      // detail piksel kode yang kecil tetap terjaga. Hanya dijalankan setiap
      // beberapa frame saat tidak ada kode ditemukan — bukan tiap frame — agar
      // tidak membebani HP kelas bawah maupun mengganggu kelancaran kamera.
      if(!code){
        scanFrameCounter = (scanFrameCounter + 1) % 3;
        if(scanFrameCounter === 0){
          scanCanvasFull.width = vw; scanCanvasFull.height = vh;
          scanCtxFull.drawImage(video, 0, 0, vw, vh);
          const cropW = Math.round(vw * 0.5), cropH = Math.round(vh * 0.5);
          const cropX = Math.round((vw - cropW) / 2), cropY = Math.round((vh - cropH) / 2);
          const centerImg = scanCtxFull.getImageData(cropX, cropY, cropW, cropH);
          code = jsQR(centerImg.data, centerImg.width, centerImg.height);
        }
      }
      if(code && code.data){
        const scannedCode = code.data.trim();
        const now = Date.now();
        // JEDA PER-KODE QR: jika kode ini masih dalam masa tenang (baik jeda
        // singkat anti-dobel maupun jeda 60 detik setelah berhasil tercatat),
        // kamera diam sepenuhnya untuk kode ini — TANPA bip/notifikasi apa pun,
        // supaya tidak berisik kalau kartu yang sama masih/kembali berada di
        // depan kamera. Kode QR LAIN tetap diproses seperti biasa.
        const cooldownUntil = state.scanCooldowns[scannedCode];
        if(cooldownUntil){
          if(now < cooldownUntil){
            scheduleNextScan(video);
            return;
          }
          delete state.scanCooldowns[scannedCode]; // jeda sudah berakhir — bersihkan dari peta
        }
        const found = state.students.find(s=> s.code === scannedCode);
        if(!found){
          // QR terbaca tapi kodenya tidak cocok dengan data siswa manapun.
          state.scanCooldowns[scannedCode] = now + SCAN_COOLDOWN_MS;
          playRejectBeep();
          showToast('Pemindaian ditolak — kode QR tidak dikenali / data siswa tidak ditemukan.', 'err');
          scheduleNextScan(video);
          return;
        }
        // Cek cepat berbasis cache LOKAL dulu (langsung, tanpa jaringan) untuk
        // kasus yang jelas-jelas duplikat di PERANGKAT INI. Pemeriksaan yang
        // benar-benar menentukan (termasuk LINTAS PERANGKAT lain) tetap ada
        // di server — lihat pemanggilan saveLogEntry() di bawah.
        const localDup = todayLogsFor(found.id)[state.petugasMode];
        if(localDup){
          // Sudah pasti tercatat hari ini — kode ini tidak akan pernah lolos
          // scan yang sama hari ini, jadi langsung diberi jeda panjang (10
          // menit) juga, supaya kamera tidak terus-menerus memeriksa ulang.
          state.scanCooldowns[scannedCode] = now + SAME_CODE_SUCCESS_COOLDOWN_MS;
          playRejectBeep();
          const label = state.petugasMode==='masuk' ? 'MASUK' : 'PULANG';
          showToast(`Pemindaian ditolak — ${found.name} sudah tercatat ${label} hari ini pukul ${timeOnly(localDup.timestamp)}.`, 'warn');
          scheduleNextScan(video);
          return;
        }
        // Belum tercatat menurut cache lokal — kirim & TUNGGU konfirmasi SERVER
        // sebelum benar-benar dianggap berhasil. Inilah yang mencegah dua
        // perangkat berbeda sama-sama berhasil memindai siswa yang sama pada
        // hari yang sama: server yang jadi wasit tunggal, bukan HP masing-masing.
        const log = { id:uid(), studentId:found.id, type:state.petugasMode, ket:'', note:'', timestamp:now };
        const result = await saveLogEntry(log);
        const label = state.petugasMode==='masuk' ? 'MASUK' : 'PULANG';
        if(result.duplicate){
          // Sudah tercatat lebih dulu di PERANGKAT LAIN — selaraskan cache
          // lokal dengan data sebenarnya dari server supaya pemindaian
          // berikutnya di HP ini langsung tahu tanpa perlu ke jaringan lagi.
          if(result.existing && !state.logs.some(l=>l.id===result.existing.id)){
            state.logs.push(result.existing);
          }
          state.scanCooldowns[scannedCode] = now + SAME_CODE_SUCCESS_COOLDOWN_MS;
          playRejectBeep();
          const waktu = result.existing ? ` pukul ${timeOnly(result.existing.timestamp)}` : '';
          showToast(`Pemindaian ditolak — ${found.name} sudah tercatat ${label} hari ini${waktu} (di perangkat lain).`, 'warn');
          scheduleNextScan(video);
          return;
        }
        // BERHASIL — kunci kode QR ini selama 60 detik ke depan; selama itu
        // kamera tidak akan merespons kode yang sama sama sekali, tapi tetap
        // bebas memindai kode/siswa LAIN seperti biasa.
        state.scanCooldowns[scannedCode] = now + SAME_CODE_SUCCESS_COOLDOWN_MS;
        playScanBeep();
        state.logs.push(log);
        state.lastResult = { student:found, ket:'', sendWa:state.sendWaNotif, type:state.petugasMode };
        const offlineNote = result.offline ? ' (belum tersinkron ke server — periksa koneksi)' : '';
        showToast(`Tercatat — ${found.name} ${label} pukul ${timeOnly(now)}${offlineNote}`, result.offline ? 'warn' : 'ok');
        refreshSidePanel();
        scheduleNextScan(video);
        return;
      }
    }
  }catch(e){
    // Abaikan error sesaat (mis. saat rotasi layar/frame belum siap) — jangan
    // menghentikan loop pemindaian karena satu frame gagal dibaca.
  }
  scheduleNextScan(video);
}

/* ================= INIT ================= */
loadData();
checkServerStatus();
setInterval(checkServerStatus, 120000); // periksa ulang setiap 2 menit
</script>
