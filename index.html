
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#E7F0F5">
<title>CATATAN PRESENSI SISWA-SISWI — Gerbang Pintar SMAN 4 Kota Ternate</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root{
  --cream:#E7F0F5;
  --panel:#F3F9FC;
  --panel-hi:#FFFFFF;
  --well:#E0EDF4;
  --ink:#0A2540;
  --on-accent:#F2F9FC;
  --line:rgba(15,49,74,0.14);
  --line-strong:rgba(15,49,74,0.26);
  --gold:#0F5C8C;
  --gold-dim:#0B4468;
  --green:#1B8A8A;
  --green-dim:#136666;
  --rust:#C0604B;
  --rust-dim:#8F4635;
  --text:#122A3D;
  --text-dim:#4E6B80;
  --text-faint:#8098AA;
  --radius:14px;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:
    radial-gradient(1100px 600px at 15% -10%, rgba(15,92,140,0.10), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(27,138,138,0.08), transparent 55%),
    var(--cream);
  color:var(--text);
  font-family:'Inter',sans-serif;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  font-size:17.5px;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  overscroll-behavior:none;
}
.mono{font-family:'JetBrains Mono',monospace;}
.display{font-family:'Space Grotesk',sans-serif;}
#app{height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden;}

/* ===== top bar ===== */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:9px 20px; padding-top:calc(9px + env(safe-area-inset-top));
  padding-left:calc(20px + env(safe-area-inset-left));
  padding-right:calc(20px + env(safe-area-inset-right));
  border-bottom:1px solid var(--line);
  background:rgba(247,241,224,0.72); backdrop-filter:blur(6px);
  flex-shrink:0;
}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{
  width:90px; height:90px; border-radius:50%;
  background:#fff;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 3px 10px rgba(15,92,140,0.22);
  flex-shrink:0; padding:2px;
}
.brand-mark img{width:100%; height:100%; object-fit:contain; border-radius:50%;}
.brand-mark svg{width:19px; height:19px;}
.brand-text .name{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19.5px; letter-spacing:0.2px; line-height:1.15; max-width:230px;}
.brand-text .sub{font-size:15.62px; color:var(--text-dim); letter-spacing:0.2px; line-height:1.2;}
.topbar-right{display:flex; align-items:center; gap:10px;}
.server-status{display:flex; align-items:center; gap:6px; font-size:13.12px; font-weight:500; padding:5px 10px; border-radius:20px; border:1px solid var(--line-strong); background:var(--panel); flex-shrink:0; cursor:default;}
.server-status .dot{width:7px; height:7px; border-radius:50%; background:var(--text-faint); flex-shrink:0;}
.server-status.on{color:#1E9E8C; border-color:rgba(30,158,140,0.35); background:rgba(30,158,140,0.08);}
.server-status.on .dot{background:#1E9E8C; box-shadow:0 0 0 3px rgba(30,158,140,0.2); animation:pulse 2s infinite;}
.server-status.off{color:var(--rust); border-color:rgba(192,96,75,0.3); background:rgba(192,96,75,0.06);}
.server-status.off .dot{background:var(--rust);}
.server-status.checking .dot{background:var(--text-faint); animation:pulse 1s infinite;}
.clock{font-family:'JetBrains Mono',monospace; font-size:13.75px; color:var(--text-dim); text-align:right; line-height:1.2;}
.clock b{color:var(--text); display:block; font-size:15px;}
.btn-ghost{
  background:transparent; border:1px solid var(--line-strong); color:var(--text-dim);
  padding:6px 12px; border-radius:8px; font-size:15px; cursor:pointer; font-family:'Inter';
  transition:all .15s ease;
}
.btn-ghost:hover{border-color:var(--gold); color:var(--text); background:rgba(15,92,140,0.06);}

main{flex:1; display:flex; flex-direction:column; min-height:0; overflow:hidden;}

/* ===== LANDING ===== */
.landing{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:14px 24px; position:relative; min-height:0;
}
.landing-eyebrow{
  font-family:'JetBrains Mono',monospace; font-size:13.12px; letter-spacing:2px;
  color:var(--gold); text-transform:uppercase; margin-bottom:10px; display:flex; align-items:center; gap:8px;
}
.landing-eyebrow .dot{width:5px; height:5px; border-radius:50%; background:var(--green); box-shadow:0 0 0 3px rgba(27,138,138,0.18); animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.4;}}
.landing h1{
  font-family:'Space Grotesk',sans-serif; font-weight:700;
  font-size:clamp(25px,3.25vw,35px); text-align:center; line-height:1.14; letter-spacing:-0.3px;
  max-width:640px;
}
.landing h1 span{color:var(--gold);}
.landing p.lead{
  color:var(--text-dim); font-size:15.62px; max-width:460px; text-align:center; margin-top:10px; line-height:1.5;
}

.gate-select{
  display:grid; grid-template-columns:1fr 1fr; gap:12px;
  max-width:510px; width:100%; margin-top:22px;
  position:relative;
}
.gate-select::before{
  content:''; position:absolute; left:50%; top:-12px; bottom:-12px; width:1px;
  background:linear-gradient(var(--line), var(--line-strong), var(--line));
  transform:translateX(-50%);
}
.gate-card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px; cursor:pointer; text-align:left; position:relative; overflow:hidden;
  transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
}
.gate-card:hover{transform:translateY(-3px); border-color:var(--line-strong); box-shadow:0 14px 30px rgba(60,50,20,0.16);}
.gate-card .gate-num{
  font-family:'JetBrains Mono',monospace; font-size:9.38px; color:var(--text-faint);
  letter-spacing:1.5px; text-transform:uppercase; margin-bottom:6px; display:block;
}
.gate-card .gate-icon{
  width:27px; height:27px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  margin-bottom:8px;
}
.gate-card.admin .gate-icon{background:rgba(15,92,140,0.12); border:1px solid rgba(15,92,140,0.3);}
.gate-card.petugas .gate-icon{background:rgba(27,138,138,0.12); border:1px solid rgba(27,138,138,0.3);}
.gate-card .gate-icon svg{width:14px; height:14px;}
.gate-card h3{font-family:'Space Grotesk',sans-serif; font-size:14.53px; font-weight:600; margin-bottom:3px;}
.gate-card p{font-size:10.79px; color:var(--text-dim); line-height:1.4; margin-bottom:8px;}
.gate-card .gate-enter{
  display:inline-flex; align-items:center; gap:5px; font-size:10.79px; font-weight:600;
  color:var(--text);
}
.gate-card.admin .gate-enter{color:var(--gold);}
.gate-card.petugas .gate-enter{color:var(--green);}
.gate-card .gate-enter svg{width:9px; height:9px; transition:transform .15s ease;}
.gate-card:hover .gate-enter svg{transform:translateX(3px);}

.landing-stats{
  display:flex; gap:26px; margin-top:22px; padding-top:14px; border-top:1px solid var(--line);
  max-width:680px; width:100%; justify-content:center;
}
.stat{text-align:center;}
.stat .n{font-family:'Space Grotesk',sans-serif; font-size:23.75px; font-weight:700; color:var(--gold);}
.stat .l{font-size:11.88px; color:var(--text-faint); letter-spacing:0.3px; margin-top:1px;}
.landing-copyright{margin-top:24px; padding-bottom:6px; font-size:12.5px; color:var(--text-faint); text-align:center;}

/* ===== shared screen shell ===== */
.screen{flex:1; display:flex; flex-direction:column; min-height:0; overflow:hidden;}
.screen-header{
  padding:11px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  flex-shrink:0;
}
.screen-header .back{
  display:flex; align-items:center; gap:7px; color:var(--text-dim); font-size:15px; cursor:pointer; background:none; border:none; font-family:'Inter';
}
.screen-header .back:hover{color:var(--text);}
.screen-header .back svg{width:13px; height:13px;}
.screen-title{font-family:'Space Grotesk',sans-serif; font-size:18.75px; font-weight:600;}
.screen-title .tag{
  font-family:'JetBrains Mono',monospace; font-size:11.88px; color:var(--on-accent); background:var(--gold);
  padding:2px 7px; border-radius:5px; margin-left:8px; vertical-align:middle; font-weight:600;
}
.screen-body{flex:1; padding:14px 20px 16px; max-width:1200px; width:100%; margin:0 auto; overflow-y:auto; min-height:0; -webkit-overflow-scrolling:touch;
  padding-left:calc(20px + env(safe-area-inset-left)); padding-right:calc(20px + env(safe-area-inset-right));
  padding-bottom:calc(16px + env(safe-area-inset-bottom));
}

/* ===== admin login ===== */
.login-wrap{flex:1; display:flex; align-items:center; justify-content:center; padding:16px 20px; min-height:0;}
.login-card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:22px 24px; width:100%; max-width:300px; text-align:center;
}
.login-card .lock{
  width:36px; height:36px; margin:0 auto 10px; border-radius:10px; background:rgba(15,92,140,0.12);
  border:1px solid rgba(15,92,140,0.3); display:flex; align-items:center; justify-content:center;
}
.login-card .lock svg{width:17px; height:17px;}
.login-card h3{font-family:'Space Grotesk',sans-serif; font-size:18.75px; margin-bottom:4px;}
.login-card p{font-size:14.38px; color:var(--text-dim); margin-bottom:14px;}
.pin-input{
  width:100%; background:var(--well); border:1px solid var(--line-strong); border-radius:8px;
  padding:9px; text-align:center; font-family:'JetBrains Mono',monospace; font-size:20px; letter-spacing:7px;
  color:var(--text); margin-bottom:10px;
}
.pin-input:focus{outline:none; border-color:var(--gold);}
.hint{font-size:13.12px; color:var(--text-faint); margin-bottom:12px;}
.err-msg{color:var(--rust); font-size:14.38px; margin-bottom:8px; min-height:14px;}

/* ===== buttons ===== */
.btn{
  border:none; border-radius:9px; padding:9px 16px; font-size:15.62px; font-weight:600; cursor:pointer;
  font-family:'Inter'; display:inline-flex; align-items:center; justify-content:center; gap:7px;
  transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
}
.btn:active{transform:scale(0.97);}
.btn-gold{background:linear-gradient(155deg,var(--gold),var(--gold-dim)); color:var(--on-accent); box-shadow:0 5px 14px rgba(15,92,140,0.22);}
.btn-green{background:linear-gradient(155deg,var(--green),var(--green-dim)); color:var(--gold-dim); box-shadow:0 5px 14px rgba(27,138,138,0.22);}
.btn-rust{background:linear-gradient(155deg,var(--rust),var(--rust-dim)); color:#fff; box-shadow:0 5px 14px rgba(192,96,75,0.28);}
.btn-block{width:100%;}
.btn:disabled{opacity:0.45; cursor:not-allowed;}
.btn-sm{padding:7px 11px; font-size:14.38px; border-radius:7px;}
.btn-outline{background:transparent; border:1px solid var(--line-strong); color:var(--text);}
.btn-outline:hover{border-color:var(--gold);}

/* ===== tabs ===== */
.tabs{display:flex; gap:6px; margin-bottom:12px; border-bottom:1px solid var(--line);}
.tab{
  padding:8px 4px; margin-right:18px; font-size:15.62px; color:var(--text-dim); cursor:pointer;
  border-bottom:2px solid transparent; font-weight:500; background:none; border-top:none; border-left:none; border-right:none; font-family:'Inter';
}
.tab.active{color:var(--gold); border-bottom-color:var(--gold);}

/* ===== cards / tables ===== */
.panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;}
.panel + .panel{margin-top:12px;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.field label{display:block; font-size:13.75px; color:var(--text-dim); margin-bottom:4px;}
.field input, .field select{
  width:100%; background:var(--well); border:1px solid var(--line-strong); border-radius:7px;
  padding:8px 10px; color:var(--text); font-size:15.62px; font-family:'Inter';
}
.field input:focus, .field select:focus{outline:none; border-color:var(--gold);}
.field{margin-bottom:9px;}

.stu-list{display:flex; flex-direction:column; gap:7px; margin-top:4px; max-height:220px; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.stu-row{
  display:flex; align-items:center; gap:11px; padding:9px 11px; background:var(--well);
  border:1px solid var(--line); border-radius:9px;
}
.stu-avatar{
  width:30px; height:30px; border-radius:8px; background:var(--panel-hi); border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
  font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14.38px; color:var(--gold); flex-shrink:0;
}
.stu-info{flex:1; min-width:0;}
.stu-info .nm{font-size:15.62px; font-weight:600;}
.stu-info .meta{font-size:13.12px; color:var(--text-dim); margin-top:1px;}
.stu-info .meta .code{font-family:'JetBrains Mono',monospace; color:var(--text-faint);}
.stu-actions{display:flex; gap:6px; flex-shrink:0;}
.icon-btn{
  width:27px; height:27px; border-radius:7px; border:1px solid var(--line-strong); background:transparent;
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-dim);
}
.icon-btn:hover{border-color:var(--gold); color:var(--gold);}
.icon-btn svg{width:13px; height:13px;}

.empty{text-align:center; padding:22px 16px; color:var(--text-faint);}
.empty svg{width:26px; height:26px; margin-bottom:8px; opacity:0.5;}
.empty p{font-size:15px;}

/* qr modal */
.overlay{
  position:fixed; inset:0; background:rgba(10,16,28,0.72); backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
}
.qr-modal{
  background:var(--panel); border:1px solid var(--line-strong); border-radius:var(--radius);
  padding:18px; max-width:280px; width:100%; text-align:center;
}
.id-card{
  background:linear-gradient(160deg, #0D3A5C, #061A2B); border:1px solid var(--gold-dim); border-radius:11px;
  padding:14px; margin-bottom:12px;
}
.id-card .school{font-size:11.25px; letter-spacing:1.2px; color:var(--green); text-transform:uppercase; margin-bottom:10px; font-family:'JetBrains Mono';}
.id-card .qr-box{background:#fff; padding:8px; border-radius:7px; display:inline-block; margin-bottom:10px;}
.id-card .nm{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17.5px; color:#EAF4FA;}
.id-card .cls{font-size:13.75px; color:#AFCBDB; margin-top:2px;}
.id-card .code{font-family:'JetBrains Mono',monospace; font-size:12.5px; color:rgba(225,230,240,0.55); margin-top:6px;}
.modal-actions{display:flex; gap:8px;}

/* riwayat table */
.log-list{max-height:280px; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.log-row{
  display:grid; grid-template-columns:60px 1fr 80px 95px 1fr; gap:10px; align-items:center;
  padding:8px 10px; border-bottom:1px solid var(--line); font-size:14.38px;
}
.log-row.head{color:var(--text-faint); font-size:11.88px; text-transform:uppercase; letter-spacing:0.5px; font-family:'JetBrains Mono';}
.log-time{font-family:'JetBrains Mono',monospace; color:var(--text-dim); font-size:13.75px;}
.pill{display:inline-flex; align-items:center; padding:2px 8px; border-radius:20px; font-size:12.5px; font-weight:600;}
.pill.masuk{background:rgba(27,138,138,0.15); color:var(--green);}
.pill.pulang{background:rgba(15,92,140,0.15); color:var(--gold);}
.pill.manual{background:rgba(192,96,75,0.15); color:var(--rust);}
.pill.ket-Hadir{background:rgba(27,138,138,0.12); color:var(--green);}
.pill.ket-Sakit{background:rgba(91,123,150,0.16); color:#5B7B96;}
.pill.ket-Ijin{background:rgba(122,92,150,0.15); color:#7A5C96;}
.pill.ket-Alpa, .pill.ket-Bolos{background:rgba(192,96,75,0.15); color:var(--rust);}
.pill.ket-Emergency{background:rgba(192,96,75,0.28); color:#8A3420;}
.pill.ket-Lainnya{background:rgba(27,42,61,0.08); color:var(--text-dim);}
.wa-tag{font-size:14.38px; color:var(--text-faint); display:flex; align-items:center; gap:5px;}
.wa-tag svg{width:12px; height:12px;}

/* ===== petugas: mode select ===== */
.mode-select{
  display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; max-width:760px; margin:18px auto 0;
}
.mode-card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px 14px; text-align:center; cursor:pointer; transition:all .18s ease;
}
.mode-card:hover{transform:translateY(-3px); border-color:var(--line-strong);}
.mode-card .m-icon{width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 10px;}
.mode-card.masuk .m-icon{background:rgba(27,138,138,0.12); border:1px solid rgba(27,138,138,0.3);}
.mode-card.pulang .m-icon{background:rgba(15,92,140,0.12); border:1px solid rgba(15,92,140,0.3);}
.mode-card.manual .m-icon{background:rgba(192,96,75,0.12); border:1px solid rgba(192,96,75,0.3);}
.mode-card.alpa .m-icon{background:rgba(192,96,75,0.12); border:1px solid rgba(192,96,75,0.3);}
.mode-card .m-icon svg{width:19px; height:19px;}
.mode-card h4{font-family:'Space Grotesk',sans-serif; font-size:17.5px; margin-bottom:4px;}
.mode-card p{font-size:13.75px; color:var(--text-dim);}
.mode-card .m-badge{
  display:inline-block; margin-top:8px; font-family:'JetBrains Mono',monospace; font-size:11.25px; letter-spacing:0.6px;
  color:var(--text-faint); border:1px solid var(--line-strong); border-radius:20px; padding:2px 8px; text-transform:uppercase;
}

/* ===== petugas: scan screen ===== */
.scan-layout{display:grid; grid-template-columns:1fr 300px; gap:16px; align-items:start;}
@media (max-width:860px){.scan-layout{grid-template-columns:1fr;}}

.scan-panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px; text-align:center;}
.cam-frame{
  position:relative; width:100%; aspect-ratio:1/1; max-width:380px; margin:0 auto;
  background:var(--ink); border-radius:12px; overflow:hidden; border:1px solid var(--line-strong);
}
.cam-frame video{width:100%; height:100%; object-fit:cover;}
.cam-frame .brackets{position:absolute; inset:32px; pointer-events:none;}
.cam-frame .brackets::before, .cam-frame .brackets::after{content:''; position:absolute; width:40px; height:40px; border:5px solid var(--gold);}
.cam-frame .brackets::before{top:0; left:0; border-right:none; border-bottom:none; border-radius:10px 0 0 0;}
.cam-frame .brackets::after{bottom:0; right:0; border-left:none; border-top:none; border-radius:0 0 10px 0;}
.cam-frame .bracket-tr{position:absolute; top:32px; right:32px; width:40px; height:40px; border:5px solid var(--gold); border-left:none; border-bottom:none; border-radius:0 10px 0 0;}
.cam-frame .bracket-bl{position:absolute; bottom:32px; left:32px; width:40px; height:40px; border:5px solid var(--gold); border-right:none; border-top:none; border-radius:0 0 0 10px;}
.cam-frame .scanline{
  position:absolute; left:32px; right:32px; height:3px; background:linear-gradient(90deg,transparent,var(--green),transparent);
  animation:scan 2.2s ease-in-out infinite; top:32px;
}
@keyframes scan{0%{top:32px;} 50%{top:calc(100% - 32px);} 100%{top:32px;}}
.cam-frame .cam-off{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; color:var(--text-faint);
}
.cam-frame .cam-off svg{width:48px; height:48px;}
.cam-hint{font-size:13.12px; color:var(--text-dim); margin-top:8px;}
.divider-or{display:flex; align-items:center; gap:10px; margin:12px 0; color:var(--text-faint); font-size:12.5px; letter-spacing:0.8px;}
.divider-or::before,.divider-or::after{content:''; flex:1; height:1px; background:var(--line);}

/* Notifikasi tulisan (toast) untuk pemindaian gagal/ditolak — tampil melayang di
   atas layar, terlihat jelas baik saat memindai lewat kamera maupun input manual. */
.global-toast{
  position:fixed; left:50%; top:14px; z-index:9999; max-width:92vw;
  padding:11px 18px; border-radius:11px; font-size:14.38px; font-weight:600; line-height:1.35;
  text-align:center; color:#fff; box-shadow:0 8px 22px rgba(0,0,0,0.28);
  opacity:0; pointer-events:none; transform:translate(-50%,-16px);
  transition:opacity .22s ease, transform .22s ease;
}
.global-toast.show{opacity:1; transform:translate(-50%,0);}
.global-toast.err{background:#B3261E;}
.global-toast.warn{background:#9A6B08;}
.global-toast.ok{background:#1E8E5A;}

.search-box{position:relative; margin-bottom:8px;}
.search-results{max-height:130px; overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; gap:6px;}
.search-item{
  display:flex; align-items:center; gap:10px; padding:7px; background:var(--well); border:1px solid var(--line);
  border-radius:8px; cursor:pointer; text-align:left;
}
.search-item:hover{border-color:var(--gold);}

.ket-slot{
  display:flex; flex-direction:column; gap:3px; padding:9px 10px; background:var(--well); border:1px solid var(--line-strong);
  border-radius:9px; cursor:pointer; text-align:left; width:100%; font-family:'Inter';
}
.ket-slot:hover{border-color:var(--gold);}
.ket-slot-label{font-size:15.62px; font-weight:600; color:var(--text); display:flex; align-items:center;}
.ket-slot-info{font-size:13.75px; color:var(--text-dim);}
.ket-slot.ket-slot-empty{cursor:default; opacity:0.6;}
.ket-slot.ket-slot-empty:hover{border-color:var(--line-strong);}
.ket-slot.ket-slot-empty .ket-slot-info{color:var(--text-faint);}

.side-panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px; max-height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.side-panel h4{font-family:'Space Grotesk',sans-serif; font-size:15.62px; margin-bottom:10px; display:flex; align-items:center; gap:6px;}
.selected-stu{
  display:flex; align-items:center; gap:10px; padding:10px; background:var(--well); border-radius:9px; margin-bottom:12px; border:1px solid var(--line-strong);
}
.selected-stu .stu-avatar{width:34px; height:34px; font-size:15.62px;}
.ket-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:10px;}
.ket-opt{
  padding:7px 6px; border-radius:8px; border:1px solid var(--line-strong); background:var(--well);
  font-size:13.75px; text-align:center; cursor:pointer; color:var(--text-dim); font-weight:500;
}
.ket-opt.active{border-color:var(--green); color:var(--green); background:rgba(27,138,138,0.14); font-weight:700;}
.ket-opt-add{border-style:dashed;}
.ket-opt-add::before{content:'+ '; }
.ket-opt-add.active::before{content:'✓ '; }
.side-panel .placeholder{text-align:center; padding:16px 8px; color:var(--text-faint); font-size:14.38px;}

.result-card{text-align:center; padding:4px 2px;}
.result-icon{width:42px; height:42px; border-radius:50%; margin:0 auto 10px; display:flex; align-items:center; justify-content:center;}
.result-icon.ok{background:rgba(27,138,138,0.15); border:2px solid var(--green);}
.result-icon svg{width:20px; height:20px;}
.result-card h3{font-family:'Space Grotesk',sans-serif; font-size:18.12px; margin-bottom:3px;}
.result-card p{font-size:13.75px; color:var(--text-dim); margin-bottom:10px;}
.wa-preview{
  background:var(--well); border:1px solid var(--line); border-radius:9px; padding:9px; text-align:left;
  font-size:13.12px; color:var(--text-dim); margin-bottom:10px; line-height:1.45; white-space:pre-wrap; max-height:120px; overflow-y:auto;
}
.wa-preview b{color:var(--text);}

::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:6px;}

/* ===== TABLET (layar sedang, sebelum turun ke mode HP) ===== */
@media (max-width:760px) and (min-width:641px){
  .mode-select{grid-template-columns:repeat(2, 1fr); max-width:520px;}
}

.landing{overflow-y:auto; -webkit-overflow-scrolling:touch;}
.login-wrap{overflow-y:auto; -webkit-overflow-scrolling:touch;}

/* ===== MOBILE / PORTRAIT (Android & iPhone) ===== */
@media (max-width:640px){
  html{ -webkit-text-size-adjust:100%; }
  .topbar{padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top)); padding-left:calc(14px + env(safe-area-inset-left)); padding-right:calc(14px + env(safe-area-inset-right));}
  .brand-mark{width:72px; height:72px;}
  .brand-text .name{font-size:16.38px; max-width:150px; line-height:1.1;}
  .brand-text .sub{font-size:13.25px;}
  .clock{display:none;}
  .server-status{padding:5px; gap:0;}
  .server-status .label{display:none;}
  .btn-ghost{padding:6px 10px; font-size:13.75px;}

  .landing{padding:10px 16px; padding-left:calc(16px + env(safe-area-inset-left)); padding-right:calc(16px + env(safe-area-inset-right));}
  .landing-eyebrow{font-size:11.88px; margin-bottom:8px;}
  .landing h1{font-size:23.75px; max-width:340px; line-height:1.18;}
  .landing p.lead{font-size:14.38px; margin-top:8px; max-width:320px;}

  .gate-select{grid-template-columns:1fr; gap:8px; margin-top:12px; max-width:255px;}
  .gate-select::before{display:none;}
  .gate-card{padding:10px; display:flex; align-items:center; gap:9px; text-align:left;}
  .gate-card .gate-icon{margin-bottom:0; width:26px; height:26px; flex-shrink:0;}
  .gate-card .gate-num{display:none;}
  .gate-card h3{font-size:13.13px; margin-bottom:2px;}
  .gate-card p{display:none;}
  .gate-card .gate-enter{font-size:10.31px; margin-top:2px;}
  .gate-card > div:not(.gate-icon){flex:1; min-width:0;}
  .gate-text{display:flex; flex-direction:column;}

  .landing-stats{margin-top:14px; padding-top:10px; gap:18px; max-width:340px;}
  .stat .n{font-size:20px;}
  .stat .l{font-size:10.62px;}

  .screen-header{padding:9px 14px; padding-left:calc(14px + env(safe-area-inset-left)); padding-right:calc(14px + env(safe-area-inset-right));}
  .screen-title{font-size:16.88px;}
  .screen-body{padding:10px 14px 14px; padding-left:calc(14px + env(safe-area-inset-left)); padding-right:calc(14px + env(safe-area-inset-right)); padding-bottom:calc(14px + env(safe-area-inset-bottom));}

  .grid-2{grid-template-columns:1fr;}
  .mode-select{grid-template-columns:1fr; max-width:320px; gap:10px;}
  .mode-card{display:flex; align-items:center; gap:12px; text-align:left; padding:13px 14px;}
  .mode-card .m-icon{margin:0; flex-shrink:0;}
  .mode-text{display:flex; flex-direction:column;}

  .scan-layout{grid-template-columns:1fr; gap:12px;}
  .cam-frame{max-width:300px;}
  .side-panel{max-height:none;}

  .log-row{grid-template-columns:44px 1fr 54px 58px; gap:5px; font-size:12.5px; padding:7px 8px;}
  .log-row > div:nth-child(5){display:none;}
  .pill{padding:2px 6px; font-size:11.25px;}

  /* prevent iOS auto-zoom on focus: inputs need >=16px */
  input, select{font-size:20px !important;}

  .btn{min-height:40px;}
  .icon-btn, .ket-opt, .gate-card, .mode-card, .search-item{min-height:36px;}
}

@media (max-width:360px){
  .landing h1{font-size:21.25px;}
  .gate-card h3{font-size:16.25px;}
}

.footer-note{
  text-align:center; padding:8px 16px; font-size:12.5px; color:var(--text-faint); border-top:1px solid var(--line);
  flex-shrink:0; padding-bottom:calc(8px + env(safe-area-inset-bottom));
}
</style>
</head>

/* ================= KONFIGURASI SERVER ================= */
// Isi dengan URL Web App hasil Deploy dari Code.gs (diakhiri /exec), dan
// password (API_PASSWORD) yang sama dengan yang ditulis di Code.gs.
// Selama dua nilai ini kosong, verifikasi PIN akan menampilkan pesan
// "server belum terhubung" alih-alih diam-diam menerima PIN apa pun.
const API_URL = 'https://script.google.com/macros/s/AKfycbypBpqsPB8LvbqSDX-fa4vfpDVXoscSAzfJq1FbAK3Ptyy2AIkC_vuN8cgpMs6FHp_7YQ/exec'; // contoh: 'https://script.google.com/macros/s/xxxxx/exec'
const API_KEY = 'SMA04T'; // samakan dengan API_PASSWORD di Code.gs

async function callApi(payload){
  if(!API_URL){ throw new Error('SERVER_BELUM_DIKONFIGURASI'); }
  const res = await fetch(API_URL, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' }, // hindari CORS preflight Apps Script
    body: JSON.stringify({ ...payload, key: API_KEY })
  });
  const json = await res.json();
  if(!json.ok){
    const err = new Error(json.error || 'Permintaan ditolak server.');
    // Tandai error ini sebagai penolakan DUPLIKAT (bukan sekadar gagal jaringan)
    // supaya pemanggil (tickScan/confirmManualAttendance) bisa menampilkan
    // notifikasi yang tepat — bukan menganggapnya berhasil secara diam-diam.
    if(json.duplicate){ err.duplicate = true; err.existing = json.existing; }
    throw err;
  }
  return json;
}

/* ================= STATUS KONEKSI SERVER (lampu indikator) ================= */
function serverStatusBadgeHtml(){
  const cfgMap = {
    checking:    { cls:'checking', label:'Memeriksa Server...' },
    connected:   { cls:'on',       label:'Server Tersambung' },
    disconnected:{ cls:'off',      label:'Server Terputus' },
    unconfigured:{ cls:'off',      label:'Server Belum Diatur' },
  };
  const cfg = cfgMap[state.serverStatus] || cfgMap.disconnected;
  return `<div class="server-status ${cfg.cls}" id="serverStatusBadge" title="${cfg.label}"><span class="dot"></span><span class="label">${cfg.label}</span></div>`;
}

function updateServerStatusBadge(){
  const el = document.getElementById('serverStatusBadge');
  if(el) el.outerHTML = serverStatusBadgeHtml();

function monthKeyOf(ts){
  const d = new Date(ts);
  return `sigap_logs_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

async function loadData(){
  // --- muat data siswa: dari server (Google Sheets) jika sudah terhubung,
  //     jika belum/kalau gagal, pakai penyimpanan lokal sebagai cadangan ---
  let loadedFromServer = false;
  if(API_URL){
    try{
      state.students = await fetchStudentsFromServer();
      loadedFromServer = true;
    }catch(e){
      /* gagal memuat data siswa dari server, memakai data lokal sebagai cadangan */
    }
  }
  if(!loadedFromServer){
    try{
      const r = await window.storage.get(STUDENTS_KEY, false);
      if(r && r.value) state.students = JSON.parse(r.value) || [];
    }catch(e){ /* belum ada data siswa */ }
  }

  // --- muat riwayat gerbang: dari server (Google Sheets) jika sudah terhubung,
  //     jika belum/kalau gagal, pakai penyimpanan lokal per-bulan sebagai cadangan ---
  let logsFromServer = false;
  if(API_URL){
    try{
      state.logs = await fetchLogsFromServer();
      logsFromServer = true;
    }catch(e){
      /* gagal memuat riwayat dari server, memakai data lokal sebagai cadangan */
    }
  }
  if(!logsFromServer){
    try{
      const listed = await window.storage.list('sigap_logs_', false);
      const monthKeys = (listed && listed.keys ? listed.keys : []).sort().reverse().slice(0, LOG_MONTHS_TO_LOAD);
      let allLogs = [];
      for(const k of monthKeys){
        try{
          const r = await window.storage.get(k, false);
          if(r && r.value){ allLogs = allLogs.concat(JSON.parse(r.value) || []); }
        }catch(e){ /* lewati bulan ini jika gagal dibaca */ }
      }
      state.logs = allLogs;
    }catch(e){ /* belum ada riwayat sama sekali */ }
  }

  render();
}

// Mengirim catatan Masuk/Pulang/Alpa ke SERVER dan MENUNGGU konfirmasinya —
// inilah kunci pencegahan pemindaian ganda LINTAS PERANGKAT: server (bukan
// cache lokal HP ini) yang memutuskan apakah siswa ini sudah tercatat hari
// ini oleh perangkat lain. Mengembalikan salah satu dari:
//   { ok:true }                          — tersimpan & terverifikasi server
//   { ok:false, duplicate:true, existing } — DITOLAK, sudah tercatat (di
//                                            perangkat manapun) — `existing`
//                                            dipakai untuk menyelaraskan
//                                            cache lokal & pesan notifikasi
//   { ok:true, offline:true }            — server tak terjangkau, tersimpan
//                                            LOKAL saja (tidak terverifikasi
//                                            lintas perangkat)
async function saveLogEntry(log){
  if(API_URL){
    try{
      await callApi({ action:'addLog', log });
      return { ok:true };
    }catch(e){
      if(e.duplicate){
        return { ok:false, duplicate:true, existing:e.existing };
      }
      // gagal karena sebab lain (jaringan/server) — lanjut ke penyimpanan
      // lokal di bawah supaya catatan tidak hilang, tapi ditandai `offline`
      // karena TIDAK bisa dijamin bebas duplikat lintas perangkat.
    }
  }
  const key = monthKeyOf(log.timestamp);
  try{
    let monthLogs = [];
    try{
      const r = await window.storage.get(key, false);
      if(r && r.value) monthLogs = JSON.parse(r.value) || [];
    }catch(e){ /* bulan ini belum punya data */ }
    monthLogs.push(log);
    await window.storage.set(key, JSON.stringify(monthLogs), false);
  }catch(e){ /* gagal menyimpan catatan gerbang */ }
  return { ok:true, offline:!API_URL ? undefined : true };
}

// Memperbarui keterangan (ket/note) pada catatan masuk/pulang yang SUDAH ADA —
// dipakai oleh mode "Input Manual" (keterangan tambahan bersifat opsional),
// bukan membuat baris riwayat baru.
async function updateLogEntry(log){
  if(API_URL){
    try{
      await callApi({ action:'updateLog', log });
      return;
    }catch(e){
      // lanjut ke penyimpanan lokal di bawah supaya perubahan tidak hilang
    }
  }
  const key = monthKeyOf(log.timestamp);
  try{
    let monthLogs = [];
    try{
      const r = await window.storage.get(key, false);
      if(r && r.value) monthLogs = JSON.parse(r.value) || [];
    }catch(e){ /* bulan ini belum punya data */ }
    const idx = monthLogs.findIndex(l=>l.id===log.id);
    if(idx>=0){ monthLogs[idx] = log; } else { monthLogs.push(log); }
    await window.storage.set(key, JSON.stringify(monthLogs), false);
  }catch(e){ /* gagal menyimpan perubahan keterangan */ }
}

function nowStr(){ return new Date().toLocaleString('id-ID',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
function timeOnly(ts){ return new Date(ts).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); }

function waLink(phone, text){
  let p = (phone||'').replace(/[^0-9]/g,'');
  if(p.startsWith('0')) p = '62' + p.slice(1);
  if(!p.startsWith('62')) p = '62' + p;
  return `https://wa.me/${p}?text=${encodeURIComponent(text)}`;
}

function buildWaMessage(student, type, ket, note){
  const displayKet = ket || 'Hadir';
  let msg = `*CATATAN PRESENSI SISWA-SISWI*\n*SMAN 4 Kota Ternate*\n\nAssalamu'alaikum, Bapak/Ibu Wali dari *${student.name}* (${student.kelas}).\n\n`;
  if(type === 'manual'){
    msg += `Keterangan: *${displayKet}*\nWaktu dicatat: ${nowStr()} WIT`;
  }else{
    const label = type === 'masuk' ? 'TIBA DI SEKOLAH' : 'PULANG SEKOLAH';
    msg += `Status: *${label}*\nWaktu: ${nowStr()} WIT`;
    // Baris "Keterangan" hanya ditampilkan jika ada catatan khusus (Sakit/Ijin/dll)
    // yang ditambahkan lewat Input Manual (Keterangan) — pemindaian masuk/pulang
    // biasa tidak membawa keterangan apa pun.
    if(ket && ket !== 'Hadir'){ msg += `\nKeterangan: *${displayKet}*`; }
  }
  if(ket === 'Lainnya' && note) msg += ` — ${note}`;
  if(ket && ket !== 'Hadir') msg += `\n\nMohon menjadi perhatian Bapak/Ibu.`;
  msg += `\n\nPesan otomatis, mohon tidak dibalas.`;
  return msg;
}

function todayLogsFor(studentId){
  const todays = state.logs.filter(l=> l.studentId===studentId && isToday(l.timestamp) && (l.type==='masuk'||l.type==='pulang'));

}

      </div>
      <div class="modal-actions">
        <button class="btn btn-outline btn-block" id="btnCloseQr">Tutup</button>
        <button class="btn btn-gold btn-block" id="btnDownloadQr">Unduh Kartu</button>
      </div>
    </div>
  </div>`;
}

  return `<div class="empty">${ICON.empty}<p>${text}</p></div>`;
}

/* ================= PETUGAS: layar scan ================= */
function screenPetugasScan(){
  const isManual = state.petugasMode !== 'masuk' && state.petugasMode !== 'pulang';
  const modeLabel = state.petugasMode==='masuk' ? 'Pemindai Masuk'
    : state.petugasMode==='pulang' ? 'Pemindai Pulang'
    : state.petugasMode==='manualMasuk' ? 'Input Manual Masuk'
    : state.petugasMode==='manualPulang' ? 'Input Manual Pulang'
    : 'Input Keterangan';
  const modeTag = state.petugasMode==='masuk' ? 'MASUK'
    : state.petugasMode==='pulang' ? 'PULANG'
    : state.petugasMode==='manualMasuk' ? 'MANUAL MASUK'
    : state.petugasMode==='manualPulang' ? 'MANUAL PULANG'
    : 'KETERANGAN';
  return `
  <div class="screen">
    ${screenHeaderBar(`${modeLabel} <span class="tag">${modeTag}</span>`)}
    <div class="screen-body">
      <div class="scan-layout">
        <div>
          ${isManual ? '' : `
          <div class="scan-panel">
            <div class="cam-frame" id="camFrame">
              <video id="camVideo" playsinline webkit-playsinline muted autoplay></video>
              <div class="brackets"></div><div class="bracket-tr"></div><div class="bracket-bl"></div>
              <div class="scanline" id="scanLine" style="display:none;"></div>
              <div class="cam-off" id="camOffMsg">${ICON.camOff}<span style="font-size:13.75px;">Kamera belum aktif</span></div>
            </div>
            <div style="display:flex; gap:8px; margin-top:10px;">
              <button class="btn btn-green" id="btnToggleCam" style="flex:1;">Aktifkan Kamera</button>
              <button class="btn btn-outline" id="btnToggleTorch" style="display:none; flex-shrink:0; padding:9px 14px;" title="Nyalakan/matikan senter">${ICON.torch||'💡'}</button>
            </div>
            <div class="cam-hint">Arahkan kartu QR siswa ke dalam bingkai kamera.</div>
          </div>
          <div class="divider-or">ATAU CARI MANUAL</div>`}
          <div class="scan-panel" style="text-align:left;">
            ${isManual ? `<p style="font-size:15px;color:var(--text-dim);margin-bottom:10px;">${
              state.petugasMode==='manualMasuk' ? 'Cari siswa untuk mencatat kedatangan secara manual tanpa pindai QR.'
              : state.petugasMode==='manualPulang' ? 'Cari siswa untuk mencatat kepulangan secara manual tanpa pindai QR.'
              : 'Cari siswa yang sudah tercatat masuk/pulang hari ini untuk menambahkan keterangan opsional (Sakit, Ijin, Bolos, Emergency dll).'
            }</p>` : ''}
            <div class="search-box">
              <input class="field" id="searchInput" placeholder="Cari nama siswa atau kelas..." style="width:100%;background:var(--well);border:1px solid var(--line-strong);border-radius:7px;padding:7px 10px;color:var(--text);font-size:14.38px;">
            </div>
            <div class="search-results" id="searchResults">${searchResultsHtml()}</div>
          </div>
        </div>

        <div class="side-panel" id="sidePanel">${sidePanelContent()}</div>
      </div>
    </div>
  </div>`;
}

function searchResultsHtml(){
  const q = (state.searchQuery||'').toLowerCase();
  const list = state.students.filter(s => !q || s.name.toLowerCase().includes(q) || s.kelas.toLowerCase().includes(q)).slice(0,8);
  if(state.students.length===0) return emptyState('Belum ada data siswa. Tambahkan lewat panel Admin.');
  if(list.length===0) return `<div style="padding:16px;color:var(--text-faint);font-size:16.25px;">Tidak ditemukan.</div>`;
  return list.map(s=>`
    <button class="search-item" data-pick="${s.id}">
      <div class="stu-avatar" style="width:32px;height:32px;font-size:15px;">${initials(s.name)}</div>
      <div class="stu-info"><div class="nm" style="font-size:16.25px;">${escapeHtml(s.name)}</div><div class="meta">${escapeHtml(s.kelas)}</div></div>
    </button>`).join('');
}

function sidePanelContent(){
  const mode = state.petugasMode;
  const isQuickManual = mode === 'manualMasuk' || mode === 'manualPulang';
  if(state.lastResult){
    const {student, ket, sendWa, type, updated} = state.lastResult;
    const effectiveType = type || (mode==='manualMasuk' ? 'masuk' : mode==='manualPulang' ? 'pulang' : mode);
    const statusLabel = effectiveType==='masuk' ? 'Masuk' : effectiveType==='pulang' ? 'Pulang' : 'Keterangan';
    // Tampilkan "· <keterangan>" hanya jika ada keterangan khusus (Sakit/Ijin/dll).
    // Pemindaian masuk/pulang biasa tidak membawa keterangan apa pun.
    const ketSuffix = ket ? ` · ${ket}` : '';
    const resultTitle = updated ? 'Keterangan Tersimpan' : 'Tercatat';
    const nextLabel = updated ? 'Tambahkan Lagi' : (mode==='masuk'||mode==='pulang') ? 'Pindai Berikutnya' : 'Catat Berikutnya';
    if(!sendWa){
      return `
      <div class="result-card">
        <div class="result-icon ok">${ICON.check}</div>
        <h3>${resultTitle}</h3>
        <p>${escapeHtml(student.name)} — ${statusLabel}${ketSuffix}</p>
        <p style="font-size:14.38px;color:var(--text-faint);margin-bottom:14px;">Notifikasi WhatsApp tidak dikirim untuk catatan ini.</p>
        <button class="btn btn-outline btn-block" id="btnScanNext">${nextLabel}</button>
      </div>`;
    }
    const msg = buildWaMessage(student, effectiveType, ket, state.lainnyaNote);
    return `
    <div class="result-card">
      <div class="result-icon ok">${ICON.check}</div>
      <h3>${resultTitle}</h3>
      <p>${escapeHtml(student.name)} — ${statusLabel}${ketSuffix}</p>
      <div class="wa-preview">${escapeHtml(msg)}</div>
      <a class="btn btn-green btn-block" href="${waLink(student.parentWA, msg)}" target="_blank" rel="noopener" style="margin-bottom:10px;">${ICON.wa} Kirim ke WA Orang Tua</a>
      <button class="btn btn-outline btn-block" id="btnScanNext">${nextLabel}</button>
    </div>`;
  }
  if(!state.selectedStudent){
    const title = mode==='manualMasuk' ? 'Input Manual Masuk' : mode==='manualPulang' ? 'Input Manual Pulang' : mode==='manual' ? 'Input Keterangan' : 'Detail Pemindaian';
    const hint = mode==='manualMasuk' ? 'Cari dan pilih siswa untuk mencatat kedatangan secara manual tanpa pindai QR.'
      : mode==='manualPulang' ? 'Cari dan pilih siswa untuk mencatat kepulangan secara manual tanpa pindai QR.'
      : mode==='manual' ? 'Cari dan pilih siswa yang sudah tercatat masuk/pulang hari ini untuk menambahkan keterangan opsional.'
      : 'Pindai kartu QR atau pilih siswa dari pencarian untuk melanjutkan.';
    return `<h4>${ICON.qr} ${title}</h4><div class="placeholder">${hint}</div>`;
  }
  const s = state.selectedStudent;

  // Panel konfirmasi ringkas untuk SEMUA jenis pencatatan kehadiran (baik siswa
  // dipilih manual saat mode Pemindai Masuk/Pulang, maupun lewat Input Manual
  // Masuk/Pulang/Alpa) — TIDAK ada pilihan keterangan (Hadir/Sakit/dll) di sini
  // sama sekali (kecuali Alpa, yang memang keterangannya sudah pasti "Alpa").
  // Keterangan lain (Sakit/Ijin/dll) hanya dapat ditambahkan belakangan lewat
  // mode terpisah "Input Manual (Keterangan)" di bawah, untuk siswa yang sudah
  // tercatat masuk/pulang.
  if(mode === 'masuk' || mode === 'pulang' || isQuickManual){
    const type = mode === 'manualMasuk' ? 'masuk' : mode === 'manualPulang' ? 'pulang' : mode;
    const label = type === 'masuk' ? 'Masuk' : 'Pulang';
    const btnClass = type === 'masuk' ? 'btn-green' : 'btn-gold';
    const heading = isQuickManual ? `Input Manual ${label}` : 'Konfirmasi Kehadiran';
    return `
    <h4>${ICON.qr} ${heading}</h4>
    <div class="selected-stu">
      <div class="stu-avatar">${initials(s.name)}</div>
      <div class="stu-info"><div class="nm">${escapeHtml(s.name)}</div><div class="meta">${escapeHtml(s.kelas)} · <span class="code">${s.code}</span></div></div>
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:15px;color:var(--text-dim);margin-bottom:12px;cursor:pointer;">
      <input type="checkbox" id="waOptIn" ${state.sendWaNotif?'checked':''} style="width:15px;height:15px;accent-color:var(--gold);">
      Kirim notifikasi WhatsApp ke orang tua
    </label>
    <button class="btn ${btnClass} btn-block" id="btnQuickManualConfirm" data-type="${type}">${ICON[type]} Konfirmasi ${label}</button>
    <button class="btn btn-outline btn-block" id="btnCancelSelect" style="margin-top:8px;">Batal</button>
    `;
  }

  // Mode "Input Manual" (keterangan) — TIDAK membuat catatan baru. Menambahkan
  // keterangan opsional (Sakit/Ijin/Alpa/dll) pada catatan Masuk atau Pulang
  // siswa yang HARI INI sudah tercatat, baik lewat pindai QR maupun input manual.
  // Ini SATU-SATUNYA tempat keterangan (selain "Hadir") bisa ditambahkan — untuk
  // siswa yang masuk/pulang dalam keadaan Sakit, Ijin, Bolos, Emergency, dll.
  if(mode === 'manual'){
    const t = todayLogsFor(s.id);

    if(!state.selectedKetTarget){
      const slot = (type, log) => {
        const label = type==='masuk' ? 'Masuk' : 'Pulang';
        if(!log){
          return `<div class="ket-slot ket-slot-empty">
            <div class="ket-slot-label">${label}</div>
            <div class="ket-slot-info">Belum tercatat hari ini</div>
          </div>`;
        }
        return `<button class="ket-slot" data-ket-target="${type}">
          <div class="ket-slot-label">${label}&nbsp; <span class="pill ket-${log.ket||'Hadir'}">${log.ket||'Hadir'}</span></div>
          <div class="ket-slot-info">Tercatat ${timeOnly(log.timestamp)}${log.note?` · ${escapeHtml(log.note)}`:''}</div>
        </button>`;
      };
      const noneYet = !t.masuk && !t.pulang;
      return `
      <h4>${ICON.qr} Input Keterangan</h4>
      <div class="selected-stu">
        <div class="stu-avatar">${initials(s.name)}</div>
        <div class="stu-info"><div class="nm">${escapeHtml(s.name)}</div><div class="meta">${escapeHtml(s.kelas)} · <span class="code">${s.code}</span></div></div>
      </div>
      <label style="display:block;font-size:15px;color:var(--text-dim);margin-bottom:8px;">Pilih catatan hari ini untuk ditambahkan keterangan</label>
      <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:6px;">
        ${slot('masuk', t.masuk)}
        ${slot('pulang', t.pulang)}
      </div>
      ${noneYet ? `<p style="font-size:14.38px;color:var(--text-faint);margin:6px 0 12px;">Siswa ini belum tercatat masuk maupun pulang hari ini. Lakukan pemindaian QR atau Input Manual Masuk/Pulang terlebih dahulu.</p>` : ''}
      <button class="btn btn-outline btn-block" id="btnCancelSelect" style="margin-top:8px;">Batal</button>
      `;
    }

    const type = state.selectedKetTarget;
    const log = t[type];
    if(!log){ state.selectedKetTarget = null; return sidePanelContent(); }
    const label = type==='masuk' ? 'Masuk' : 'Pulang';
    return `
    <h4>${ICON.qr} Keterangan ${label}</h4>
    <div class="selected-stu">
      <div class="stu-avatar">${initials(s.name)}</div>
      <div class="stu-info"><div class="nm">${escapeHtml(s.name)}</div><div class="meta">${escapeHtml(s.kelas)} · <span class="code">${s.code}</span></div></div>
    </div>
    <p style="font-size:14.38px;color:var(--text-faint);margin-bottom:12px;">${label} tercatat ${timeOnly(log.timestamp)} · saat ini: <b>${log.ket||'Hadir'}</b>. Gunakan ini apabila siswa masuk/pulang dalam keadaan Sakit, Ijin, Bolos, Emergency, dll.</p>
    <label style="display:flex;align-items:center;gap:8px;font-size:15px;color:var(--text-dim);margin-bottom:12px;cursor:pointer;">
      <input type="checkbox" id="waOptIn" ${state.sendWaNotif?'checked':''} style="width:15px;height:15px;accent-color:var(--gold);">
      Kirim notifikasi WhatsApp ke orang tua
    </label>
    <label style="display:block;font-size:15px;color:var(--text-dim);margin-bottom:8px;">Keterangan</label>
    <div class="ket-grid">
      ${MANUAL_KET_OPTIONS.map(k=>`<button class="ket-opt ${state.selectedKet===k?'active':''} ${k==='Lainnya'?'ket-opt-add':''}" data-ket="${k}">${ketOptionLabel(k)}</button>`).join('')}
    </div>
    ${state.selectedKet==='Lainnya' ? `<div class="field"><input id="lainnyaInput" placeholder="Tulis keterangan..." value="${escapeHtml(state.lainnyaNote)}" style="width:100%;background:var(--well);border:1px solid var(--line-strong);border-radius:7px;padding:7px 10px;color:var(--text);font-size:14.38px;"></div>` : ''}
    <button class="btn btn-gold btn-block" id="btnSaveKetAnnotation" style="margin-top:6px;">${state.sendWaNotif ? 'Simpan &amp; Siapkan Notifikasi WA' : 'Simpan Keterangan'}</button>
    <button class="btn btn-outline btn-block" id="btnBackKetTarget" style="margin-top:8px;">Kembali</button>
    `;
  }
}

function escapeHtml(str){
  return String(str??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ================= EVENTS ================= */
function bindGlobalEvents(){
  const $ = sel => document.querySelector(sel);
  const on = (sel, ev, fn) => { const el=$(sel); if(el) el.addEventListener(ev, fn); };

  on('#gotoAdminLogin','click',()=>{ state.screen = state.adminUnlocked ? 'admin' : 'adminLogin'; render(); });
  on('#gotoPetugas','click',()=>{ state.petugasMode=null; state.screen = state.petugasUnlocked ? 'petugasMode' : 'petugasLogin'; render(); });
  on('#btnHome','click',()=>{ stopCamera(); state.screen='landing'; render(); });
  on('#btnBack','click',()=>{ handleBack(); });

  // admin login
  on('#pinSubmit','click', submitPin);
  const pinEl = $('#pinInput'); if(pinEl){ pinEl.addEventListener('keydown', e=>{ if(e.key==='Enter') submitPin(); }); pinEl.focus(); }

  // admin tabs
  document.querySelectorAll('.tab').forEach(t=> t.addEventListener('click', ()=>{ state.adminTab = t.dataset.tab; render(); }));

  on('#btnAddStudent','click', addStudent);
  document.querySelectorAll('[data-qr]').forEach(b=> b.addEventListener('click', ()=>{
    state.qrModalStudent = state.students.find(s=>s.id===b.dataset.qr); render();
  }));
  document.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click', async ()=>{
    if(!confirm('Hapus data siswa ini?')) return;
    const id = b.dataset.del;
    if(API_URL){
      b.disabled = true;
      try{
        await callApi({ action:'deleteStudent', id });
      }catch(err){
        alert('Gagal menghapus di server: ' + err.message);
        b.disabled = false;
        return;
      }
    }
    state.students = state.students.filter(s=>s.id!==id);
    if(!API_URL){ saveStudents(); }
    render();
  }));
  on('#btnCloseQr','click', ()=>{ state.qrModalStudent=null; render(); });
  on('#btnDownloadQr','click', downloadQr);
  on('#btnDownloadAllQr','click', ()=>{
    const sel = document.getElementById('qrBulkKelas');
    const kelas = sel ? sel.value : '';
    const list = kelas ? state.students.filter(s=>s.kelas===kelas) : state.students;
    downloadAllQr(list);
  });

  // impor massal dari spreadsheet
  on('#btnDownloadTemplate','click', downloadImportTemplate);
  on('#btnPickImportFile','click', ()=>{ const fi=document.getElementById('importFileInput'); if(fi) fi.click(); });
  const importFi = $('#importFileInput');
  if(importFi){ importFi.addEventListener('change', e=>{ const f=e.target.files[0]; if(f) handleImportFile(f); e.target.value=''; }); }
  on('#btnCancelImport','click', ()=>{ state.importPreview=null; render(); });
  on('#btnConfirmImport','click', async ()=>{
    if(!state.importPreview || !state.importPreview.valid.length) return;
    const toImport = state.importPreview.valid;
    const btn = document.getElementById('btnConfirmImport');
    if(btn){ btn.disabled = true; btn.textContent = 'Mengimpor...'; }

    if(API_URL){
      try{
        const res = await callApi({ action:'addStudentsBulk', students: toImport });
        const { added, skipped } = res.data;
        state.students = state.students.concat(added);
        state.importPreview = null;
        render();
        if(skipped && skipped.length){
          alert(`${added.length} siswa berhasil diimpor.\n${skipped.length} baris ditolak server karena NISN sudah terdaftar:\n` +
            skipped.slice(0,10).map(s=>`- ${s.name} (NISN ${s.nisn}): ${s.reason}`).join('\n') +
            (skipped.length>10 ? `\n...dan ${skipped.length-10} lainnya` : ''));
        }
      }catch(err){
        alert('Gagal mengimpor ke server: ' + err.message);
        if(btn){ btn.disabled = false; btn.textContent = `Impor ${toImport.length} Siswa`; }
      }
    }else{
      state.students = state.students.concat(toImport);
      saveStudents();
      state.importPreview = null;
      render();
    }
  });

  // petugas mode select
  on('#modeMasuk','click', ()=>{ state.petugasMode='masuk'; resetScanState(); state.screen='petugasScan'; render(); });
  on('#modePulang','click', ()=>{ state.petugasMode='pulang'; resetScanState(); state.screen='petugasScan'; render(); });
  on('#modeManual','click', ()=>{ state.petugasMode='manual'; resetScanState(); state.screen='petugasScan'; render(); });
  on('#modeManualMasuk','click', ()=>{ state.petugasMode='manualMasuk'; resetScanState(); state.screen='petugasScan'; render(); });
  on('#modeManualPulang','click', ()=>{ state.petugasMode='manualPulang'; resetScanState(); state.screen='petugasScan'; render(); });

  // petugas scan
  on('#btnToggleCam','click', toggleCamera);
  on('#btnToggleTorch','click', toggleTorch);
  const si = $('#searchInput'); if(si){ si.value = state.searchQuery; si.addEventListener('input', e=>{ state.searchQuery = e.target.value; document.getElementById('searchResults').innerHTML = searchResultsHtml(); bindSearchPicks(); }); si.focus({preventScroll:true}); }
  bindSearchPicks();
  bindSidePanelEvents();

  updateClock();

async function submitPin(){

function normalizeNisn(n){ return String(n||'').trim(); }

function findStudentByNisn(nisn, list){
  const n = normalizeNisn(nisn);
  if(!n) return null;
  return (list || state.students).find(s => normalizeNisn(s.nisn) === n) || null;
}

async function addStudent(){

/* ================= IMPOR MASSAL DARI SPREADSHEET ================= */
const IMPORT_HEADER_ALIASES = {
  name: ['nama','nama siswa','nama lengkap','nama lengkap siswa'],
  kelas: ['kelas','kls'],
  nisn: ['nisn','nisn siswa','no nisn'],
  parentWA: ['no wa orang tua','no whatsapp orang tua','nomor wa orang tua','wa orang tua','no wa','whatsapp','no hp orang tua','nomor whatsapp','no wa ortu','no. whatsapp orang tua']
};

function normalizeHeader(h){
  return String(h||'').toLowerCase().trim().replace(/[."'`]/g,'').replace(/\s+/g,' ');
}

function matchImportField(header){
  const h = normalizeHeader(header);
  for(const field in IMPORT_HEADER_ALIASES){
    if(IMPORT_HEADER_ALIASES[field].includes(h)) return field;
  }
  return null;
}

function downloadImportTemplate(){
  const header = ['Kelas','Nama','NISN','No WA Orang Tua'];
  const example = ['XI-2','Ahmad Fahri Ramadhan','0051234567','081234567890'];
  const csv = header.join(',') + '\n' + example.join(',') + '\n';
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'template_impor_siswa.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function handleImportFile(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type:'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });
      processImportRows(rows);
    }catch(err){
      alert('Gagal membaca file. Pastikan formatnya .xlsx, .xls, atau .csv sesuai template.');
    }
  };
  reader.onerror = () => alert('Gagal membaca file.');
  reader.readAsArrayBuffer(file);
}

function processImportRows(rows){
  if(!rows || !rows.length){ alert('File kosong atau tidak terbaca.'); return; }

  const headerKeys = Object.keys(rows[0]);
  const fieldMap = {};
  headerKeys.forEach(h => { const f = matchImportField(h); if(f) fieldMap[h] = f; });

  const valid = [];
  const errors = [];
  const nisnSeenInFile = new Set(); // deteksi NISN dobel di dalam file yang sama
  rows.forEach((row, idx) => {
    const rec = {};
    for(const h in fieldMap){ rec[fieldMap[h]] = String(row[h] ?? '').trim(); }
    if(!rec.name || !rec.kelas){
      errors.push(`Baris ${idx+2}: nama atau kelas kosong, dilewati.`);
      return;
    }
    const nisn = normalizeNisn(rec.nisn);
    if(nisn){
      const dupExisting = findStudentByNisn(nisn);
      if(dupExisting){
        errors.push(`Baris ${idx+2}: NISN ${nisn} sudah terdaftar atas nama ${dupExisting.name}, dilewati.`);
        return;
      }
      if(nisnSeenInFile.has(nisn)){
        errors.push(`Baris ${idx+2}: NISN ${nisn} dobel di dalam file ini, dilewati.`);
        return;
      }
      nisnSeenInFile.add(nisn);
    }
    valid.push({
      id: uid(),
      name: rec.name,
      kelas: rec.kelas,
      nisn: rec.nisn || '',
      parentWA: rec.parentWA || '',
      code: genCode(),
    });
  });

  if(!Object.values(fieldMap).includes('name') || !Object.values(fieldMap).includes('kelas')){
    alert('Kolom "Nama" dan/atau "Kelas" tidak ditemukan di file. Gunakan template yang disediakan sebagai acuan nama kolom.');
    return;
  }

  state.importPreview = { valid, errors };
  render();
}

/* ================= UNDUH KARTU QR MASSAL (ZIP) ================= */
// Bersihkan nama file dari karakter yang tidak valid di sistem berkas.
function sanitizeFileName(str){
  return String(str||'').trim().replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,'_') || 'siswa';
}

// Render satu kode QR ke kanvas tersembunyi (di luar layar) lalu ambil data
// gambarnya sebagai data URL PNG. Dipakai berulang untuk unduhan massal
// tanpa menampilkan kanvas sementara ini ke pengguna.
function generateQrDataUrl(text, size){
  const holder = document.createElement('div');
  holder.style.position = 'absolute';
  holder.style.left = '-9999px';
  holder.style.top = '-9999px';
  document.body.appendChild(holder);
  new QRCode(holder, { text, width: size||300, height: size||300, colorDark:'#0A2540', colorLight:'#ffffff' });
  const canvas = holder.querySelector('canvas');
  const dataUrl = canvas ? canvas.toDataURL('image/png') : null;
  document.body.removeChild(holder);
  return dataUrl;
}

// Buat & unduh satu file ZIP berisi kartu QR (PNG) untuk setiap siswa di
// dalam `list`. Dipakai tombol "Unduh Kartu QR (ZIP)" di panel Admin.
async function downloadAllQr(list){
  if(typeof JSZip === 'undefined'){
    alert('Gagal memuat pustaka ZIP. Periksa koneksi internet lalu coba lagi.');
    return;
  }
  if(!list || !list.length){
    alert('Tidak ada siswa pada pilihan ini untuk diunduh kartunya.');
    return;
  }
  const btn = document.getElementById('btnDownloadAllQr');
  if(btn){ btn.disabled = true; }

  const zip = new JSZip();
  const usedNames = {};
  for(let i=0;i<list.length;i++){
    const s = list[i];
    if(btn) btn.textContent = `Menyiapkan ${i+1}/${list.length}...`;
    const dataUrl = generateQrDataUrl(s.code);
    if(dataUrl){
      const base64 = dataUrl.split(',')[1];
      let fname = `${sanitizeFileName(s.kelas)}_${sanitizeFileName(s.name)}_${s.code}.png`;
      if(usedNames[fname]){
        usedNames[fname]++;
        fname = fname.replace(/\.png$/, `_${usedNames[fname]}.png`);
      }else{
        usedNames[fname] = 1;
      }
      zip.file(fname, base64, { base64:true });
    }
    // beri jeda singkat tiap 20 kartu supaya antarmuka tetap responsif
    if(i % 20 === 19){ await new Promise(r=> setTimeout(r, 0)); }
  }

  if(btn) btn.textContent = 'Membuat file ZIP...';
  const blob = await zip.generateAsync({ type:'blob' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const scopeLabel = (list.length === state.students.length) ? 'semua-siswa' : sanitizeFileName(list[0].kelas);
  a.download = `kartu-qr-${scopeLabel}.zip`;
  a.href = url;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);

  if(btn){ btn.disabled = false; btn.innerHTML = `${ICON.download} Unduh Kartu QR (ZIP)`; }
}

// Menyimpan catatan Masuk/Pulang — dipakai untuk SEMUA jalur pencatatan biasa:
// siswa dipilih manual saat mode Pemindai Masuk/Pulang, maupun lewat Input Manual
// Masuk/Pulang. TIDAK ada keterangan (Hadir/Sakit/dll) yang disertakan di sini —
// keterangan hanya bisa ditambahkan belakangan lewat mode "Input Manual (Keterangan)".
// Kekecualian: type==='alpa' (siswa TIDAK MASUK sekolah) — dicatat langsung dengan
// keterangan "Alpa" pada slot Masuk hari itu (karena siswa memang tidak hadir sama
// sekali, jadi tidak ada catatan Masuk terlebih dahulu untuk ditambahkan keterangan).
async function confirmManualAttendance(type){
  const s = state.selectedStudent;
  if(!s) return;
  ensureAudio(); // dipanggil di dalam gestur klik tombol agar audio diizinkan browser
  // Cek cepat berbasis cache LOKAL dulu untuk kasus yang jelas-jelas duplikat
  // di PERANGKAT INI. Keputusan yang benar-benar final (termasuk mendeteksi
  // pemindaian dari PERANGKAT LAIN) tetap ditentukan oleh server di bawah.
  const localDup = todayLogsFor(s.id)[type];
  if(localDup){
    playRejectBeep();
    const label = type==='masuk' ? 'MASUK' : 'PULANG';
    showToast(`Pemindaian ditolak — ${s.name} sudah tercatat ${label} hari ini pukul ${timeOnly(localDup.timestamp)}.`, 'warn');
    return;
  }
  const sendWa = state.sendWaNotif;
  const log = { id:uid(), studentId:s.id, type, ket:'', note:'', timestamp:Date.now() };

  // Nonaktifkan tombol sementara menunggu konfirmasi server — mencegah klik
  // ganda yang bisa memicu dua permintaan untuk catatan yang sama.
  const btn = document.getElementById('btnQuickManualConfirm');
  if(btn){ btn.disabled = true; btn.dataset.origText = btn.textContent; btn.textContent = 'Memeriksa...'; }

  // Kirim & TUNGGU konfirmasi SERVER sebelum benar-benar dianggap berhasil —
  // inilah yang mencegah dua perangkat berbeda sama-sama berhasil mencatat
  // siswa yang sama pada hari yang sama.
  const result = await saveLogEntry(log);
  const label = type==='masuk' ? 'MASUK' : 'PULANG';

  if(result.duplicate){
    if(result.existing && !state.logs.some(l=>l.id===result.existing.id)){
      state.logs.push(result.existing);
    }
    playRejectBeep();
    const waktu = result.existing ? ` pukul ${timeOnly(result.existing.timestamp)}` : '';
    showToast(`Pemindaian ditolak — ${s.name} sudah tercatat ${label} hari ini${waktu} (di perangkat lain).`, 'warn');
    if(btn){ btn.disabled = false; btn.textContent = btn.dataset.origText || btn.textContent; }
    return;
  }

  playScanBeep();
  state.logs.push(log);
  state.lastResult = { student:s, ket:'', sendWa, type };
  const sp = document.getElementById('sidePanel'); if(sp) sp.innerHTML = sidePanelContent();
}

// Mode "Input Manual" (keterangan) — menyimpan keterangan opsional (Sakit/Ijin/
// Bolos/Emergency/dll) pada catatan Masuk atau Pulang siswa yang HARI INI sudah tercatat.
// Ini MENGUBAH catatan yang sudah ada, bukan membuat baris riwayat baru.
function confirmKetAnnotation(){
  const s = state.selectedStudent;
  const type = state.selectedKetTarget;
  if(!s || !type) return;
  const log = todayLogsFor(s.id)[type];
  if(!log) return;
  const sendWa = state.sendWaNotif;
  const ket = state.selectedKet;
  const note = ket==='Lainnya' ? state.lainnyaNote : '';
  log.ket = ket;
  log.note = note;
  updateLogEntry(log);
  state.lastResult = { student:s, ket, sendWa, type, updated:true };
  state.selectedKetTarget = null;
  const sp = document.getElementById('sidePanel'); if(sp) sp.innerHTML = sidePanelContent();
}
